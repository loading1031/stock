# API 스펙(openapi/openapi.json)이 코드와 같은지 검사한다 (kopring 플러그인)
# 서버 PR에서 컨트롤러·DTO를 바꾸고 스펙을 다시 만들지 않았으면 실패한다
name: API 스펙 drift

on:
  push:
    branches: [test/api-spec-ci]
  pull_request:
    branches: [test/api-spec-ci]

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: 스펙 다시 만들기
        working-directory: ci-test/backend
        run: ./gradlew test --tests '*OpenApiSpecTest'
      - name: 커밋된 스펙과 비교
        run: |
          if ! git diff --exit-code -- openapi/; then
            echo "::error::openapi/openapi.json이 코드와 다르다. ./gradlew test --tests '*OpenApiSpecTest'로 다시 만들어 커밋한다"
            exit 1
          fi
