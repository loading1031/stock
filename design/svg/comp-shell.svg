<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 760 568" role="img" aria-label="모든 화면은 위 표시줄, 왼쪽 메뉴, 오른쪽 본문의 틀을 같이 쓴다" font-size="12"><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1f1f">모든 화면은 위 표시줄, 왼쪽 메뉴, 오른쪽 본문의 틀을 같이 쓴다</text><text x="24" y="50" font-size="11.5" fill="#6b6b6b">컴포넌트 · 화면 틀 · 예시는 주문 화면을 연 모습</text><g><rect x="16" y="64" width="728" height="464" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect></g><g><rect x="16" y="64" width="728" height="40" rx="8" fill="#ededeb" stroke="#b9b6ad"></rect><text x="380" y="89" text-anchor="middle" fill="#1f1f1f">자동 주문 표시줄 (컴포넌트: 자동 주문 표시줄)</text></g><g><rect x="16" y="104" width="168" height="424" fill="#ededeb"></rect><rect x="24" y="244" width="152" height="20" rx="4" fill="#2a73d9" fill-opacity="0.12" stroke="#2a73d9"></rect><text x="32" y="128" font-weight="600" fill="#1f1f1f">홈</text><text x="40" y="144" font-size="11.5" fill="#1f1f1f">대시보드</text><text x="32" y="168" font-weight="600" fill="#1f1f1f">시장</text><text x="40" y="184" font-size="11.5" fill="#1f1f1f">종목 검색·관심 종목</text><text x="40" y="200" font-size="11.5" fill="#1f1f1f">종목 차트</text><text x="40" y="216" font-size="11.5" fill="#1f1f1f">아침 해외 지표</text><text x="32" y="240" font-weight="600" fill="#1f1f1f">매매</text><text x="40" y="258" font-size="11.5" font-weight="600" fill="#1f1f1f">주문</text><text x="40" y="280" font-size="11.5" fill="#1f1f1f">미체결 주문 취소</text><text x="40" y="296" font-size="11.5" fill="#1f1f1f">포지션 계획</text><text x="32" y="320" font-weight="600" fill="#1f1f1f">판단</text><text x="40" y="336" font-size="11.5" fill="#1f1f1f">아침 리포트·판단 기록</text><text x="40" y="352" font-size="11.5" fill="#1f1f1f">전략 목록·설정</text><text x="32" y="376" font-weight="600" fill="#1f1f1f">성과</text><text x="40" y="392" font-size="11.5" fill="#1f1f1f">장부 비교·평가</text><text x="40" y="408" font-size="11.5" fill="#1f1f1f">백테스트 결과</text><text x="32" y="432" font-weight="600" fill="#1f1f1f">관리</text><text x="40" y="448" font-size="11.5" fill="#1f1f1f">계좌 연결</text><text x="40" y="464" font-size="11.5" fill="#1f1f1f">리스크 설정</text><text x="40" y="480" font-size="11.5" fill="#1f1f1f">대사 결과</text><text x="40" y="496" font-size="11.5" fill="#6b6b6b">실전 전환 · M7부터</text></g><g><text x="200" y="132" font-size="15" font-weight="600" fill="#1f1f1f">주문</text><text x="200" y="150" font-size="11.5" fill="#6b6b6b">매매 › 주문</text><text x="728" y="132" text-anchor="end" font-size="11.5" fill="#2a73d9">종목 차트 ▸  대시보드 ▸</text><text x="728" y="150" text-anchor="end" font-size="11.5" fill="#6b6b6b">업무 흐름의 앞뒤 화면 링크</text><rect x="200" y="164" width="528" height="348" rx="8" fill="none" stroke="#b9b6ad" stroke-dasharray="4 4"></rect><text x="464" y="342" text-anchor="middle" fill="#6b6b6b">화면 본문 — 각 화면 페이지의 와이어프레임</text></g><text x="24" y="552" font-size="11.5" fill="#6b6b6b">로그인만 틀 없이 가운데 카드다. 아직 만들지 않은 마일스톤의 화면은 메뉴에서 숨긴다(제안)</text></svg>
