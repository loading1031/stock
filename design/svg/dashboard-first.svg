<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 760 584" role="img" aria-label="대시보드 첫 판은 잔고 조회 한 번의 결과를 요약 카드와 보유 종목 표로 보여 준다" font-size="12"><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1f1f">대시보드 첫 판은 잔고 조회 한 번의 결과를 요약 카드와 보유 종목 표로 보여 준다</text><text x="24" y="50" font-size="11.5" fill="#6b6b6b">와이어프레임 초안 · 모의 주식 계좌 · 값은 B-02 실측 예시 또는 자리 표시</text><g><rect x="16" y="64" width="728" height="496" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect></g><g><rect x="16" y="64" width="728" height="40" rx="8" fill="#ededeb" stroke="#b9b6ad"></rect><text x="380" y="88" text-anchor="middle" fill="#6b6b6b">자동 주문 표시줄 · 변형 7 (M1~M3, 시세: 조회만)</text></g><g><text x="32" y="132" font-size="15" font-weight="600" fill="#1f1f1f">대시보드</text><text x="32" y="150" font-size="11.5" fill="#6b6b6b">홈 › 대시보드</text><text x="728" y="132" text-anchor="end" font-size="11.5" fill="#2a73d9">계좌 연결 ▸</text><text x="728" y="150" text-anchor="end" font-size="11.5" fill="#6b6b6b">계좌가 없거나 토큰이 실패하면 여기로</text></g><g><text x="32" y="185" font-size="13" font-weight="600" fill="#1f1f1f">계좌 잔고</text><text x="104" y="185" font-size="11.5" fill="#6b6b6b">잔고 조회(VTTC8434R) 결과를 그대로</text><text x="600" y="185" text-anchor="end" font-size="11.5" fill="#6b6b6b">마지막 조회 —</text><rect x="616" y="166" width="112" height="28" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="672" y="185" text-anchor="middle" fill="#1f1f1f">새로고침</text><text x="728" y="212" text-anchor="end" font-size="11.5" fill="#6b6b6b">장중 30초 자동(가정값) · 장 밖은 수동 · 조회 중에는 버튼 비활성</text></g><g><rect x="32" y="224" width="221" height="108" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25" stroke-dasharray="none"></rect><text x="48" y="250" font-size="11.5" fill="#6b6b6b">예수금 (매매 반영)</text><text x="48" y="282" font-size="18" font-weight="600" fill="#1f1f1f">99,999,306원</text><text x="48" y="304" font-size="11.5" fill="#6b6b6b">prvs_rcdl_excc_amt · B-02 실측</text><text x="48" y="320" font-size="11.5" fill="#6b6b6b">dnca_tot_amt는 결제 전 기준</text></g><g><rect x="269" y="224" width="221" height="108" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25" stroke-dasharray="none"></rect><text x="285" y="250" font-size="11.5" fill="#6b6b6b">주문 가능 현금 · ord_psbl_cash</text><text x="285" y="282" font-size="18" font-weight="600" fill="#1f1f1f">약 9,950만원</text><text x="285" y="304" font-size="11.5" fill="#6b6b6b">prvs_rcdl_excc_amt의 약 99.5%</text><text x="285" y="320" font-size="11.5" fill="#6b6b6b">이유는 미확인</text></g><g><rect x="506" y="224" width="221" height="108" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25" stroke-dasharray="4 4"></rect><text x="522" y="250" font-size="11.5" fill="#6b6b6b">평가 손익 (미확인)</text><text x="522" y="282" font-size="18" font-weight="600" fill="#6b6b6b">—</text><text x="522" y="304" font-size="11.5" fill="#6b6b6b">응답의 필드 이름 미확인</text><text x="522" y="320" font-size="11.5" fill="#6b6b6b">없으면 직접 계산, '계산' 표시</text></g><g><rect x="32" y="348" width="696" height="196" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="48" y="374" font-size="13" font-weight="600" fill="#1f1f1f">보유 종목</text><text x="48" y="402" font-size="11.5" fill="#6b6b6b">종목코드</text><text x="120" y="402" font-size="11.5" fill="#6b6b6b">종목명</text><text x="256" y="402" font-size="11.5" fill="#6b6b6b">보유 수량</text><text x="336" y="402" font-size="11.5" fill="#6b6b6b">주문 가능 수량</text><text x="432" y="402" font-size="11.5" fill="#6b6b6b">평균 매입가</text><text x="536" y="402" font-size="11.5" fill="#6b6b6b">현재가</text><text x="624" y="402" font-size="11.5" fill="#6b6b6b">평가 손익</text><text x="48" y="416" font-size="10.5" fill="#6b6b6b">pdno</text><text x="120" y="416" font-size="10.5" fill="#6b6b6b">prdt_name</text><text x="256" y="416" font-size="10.5" fill="#6b6b6b">hldg_qty</text><text x="336" y="416" font-size="10.5" fill="#6b6b6b">ord_psbl_qty</text><text x="432" y="416" font-size="10.5" fill="#6b6b6b">pchs_avg_pric</text><text x="536" y="416" font-size="10.5" fill="#6b6b6b">prpr</text><text x="624" y="416" font-size="10.5" fill="#6b6b6b">(미확인)</text><line x1="48" x2="712" y1="426" y2="426" stroke="#e4e2dc"></line><text x="48" y="450" fill="#1f1f1f">002360</text><text x="120" y="450" fill="#1f1f1f">SH에너지화학</text><text x="256" y="450" fill="#6b6b6b">—</text><text x="336" y="450" fill="#6b6b6b">—</text><text x="432" y="450" fill="#6b6b6b">—</text><text x="536" y="450" fill="#6b6b6b">—</text><text x="624" y="450" fill="#6b6b6b">—</text><line x1="48" x2="712" y1="462" y2="462" stroke="#e4e2dc"></line><text x="48" y="484" fill="#1f1f1f">005930</text><text x="120" y="484" fill="#1f1f1f">삼성전자</text><text x="256" y="484" fill="#6b6b6b">—</text><text x="336" y="484" fill="#6b6b6b">—</text><text x="432" y="484" fill="#6b6b6b">—</text><text x="536" y="484" fill="#6b6b6b">—</text><text x="624" y="484" fill="#6b6b6b">—</text><text x="48" y="512" font-size="11.5" fill="#6b6b6b">행은 예시: B-02에서 주문해 본 종목. 수량·가격은 자리 표시, 값은 모두 마지막 조회 시각 기준</text><text x="48" y="528" font-size="11.5" fill="#6b6b6b">현재가 prpr는 조회 시점 값이다 (실시간 시세는 M2부터)</text></g></svg>
