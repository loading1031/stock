nt-weight="600" fill="#1f1f1f">주문</text><text x="288" y="408" text-anchor="middle" font-size="11" fill="#6b6b6b">해당 주문 체인</text><text x="472" y="391" text-anchor="middle" font-weight="600" fill="#1f1f1f">자동 주문 표시줄</text><text x="472" y="408" text-anchor="middle" font-size="11" fill="#6b6b6b">리셋이면 확인 뒤 재개</text></g><g><text x="24" y="454" font-size="13" font-weight="600" fill="#1f1f1f">5 · 실전 전환</text><rect x="24" y="464" width="160" height="44" rx="8" fill="none" fill-opacity="1" stroke="#b9b6ad" stroke-width="1.25"></rect><rect x="208" y="464" width="160" height="44" rx="8" fill="none" fill-opacity="1" stroke="#b9b6ad" stroke-width="1.25"></rect><rect x="392" y="464" width="160" height="44" rx="8" fill="none" fill-opacity="1" stroke="#b9b6ad" stroke-width="1.25"></rect><rect x="576" y="464" width="160" height="44" rx="8" fill="none" fill-opacity="1" stroke="#b9b6ad" stroke-width="1.25"></rect><path d="M184 486H208" fill="none" stroke="#b9b6ad" stroke-width="1.25" marker-end="url(#fl-arrow)"></path><path d="M368 486H392" fill="none" stroke="#b9b6ad" stroke-width="1.25" marker-end="url(#fl-arrow)"></path><path d="M552 486H576" fill="none" stroke="#b9b6ad" stroke-width="1.25" marker-end="url(#fl-arrow)"></path><text x="104" y="483" text-anchor="middle" font-weight="600" fill="#1f1f1f">백테스트 결과</text><text x="104" y="500" text-anchor="middle" font-size="11" fill="#6b6b6b">보수적 체결 모델</text><text x="288" y="483" text-anchor="middle" font-weight="600" fill="#1f1f1f">장부 비교·평가</text><text x="288" y="500" text-anchor="middle" font-size="11" fill="#6b6b6b">3개월 이상 앞섬</text><text x="472" y="483" text-anchor="middle" font-weight="600" fill="#1f1f1f">실전 전환</text><text x="472" y="500" text-anchor="middle" font-size="11" fill="#6b6b6b">ADMIN · 점검표</text><text x="656" y="483" text-anchor="middle" font-weight="600" fill="#1f1f1f">계좌 연결</text><text x="656" y="500" text-anchor="middle" font-size="11" fill="#6b6b6b">실전 계좌 새로 등록</text></g><text x="24" y="540" font-size="11.5" fill="#6b6b6b