<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 760 584" role="img" aria-label="종목은 검색에서 찾아 관심 종목에 더하고, 행을 눌러 차트로 간다" font-size="12"><defs><marker id="watch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2a73d9"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1f1f">종목은 검색에서 찾아 관심 종목에 더하고, 행을 눌러 차트로 간다</text><text x="24" y="50" font-size="11.5" fill="#6b6b6b">와이어프레임 초안 · 모의 주식 계좌 · 값은 B-02 실측 예시 또는 자리 표시</text><g><rect x="16" y="64" width="728" height="496" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect></g><g><rect x="16" y="64" width="728" height="40" rx="8" fill="#ededeb" stroke="#b9b6ad"></rect><text x="32" y="89" font-size="13" fill="#1f1f1f">자동 주문 표시줄 · 변형 7 (M1~M3)</text><text x="728" y="89" text-anchor="end" font-size="11.5" fill="#6b6b6b">M2부터 실시간 연결 상태를 보인다</text></g><g><text x="32" y="134" font-size="15" font-weight="600" fill="#1f1f1f">종목 검색·관심 종목</text><text x="32" y="152" font-size="11.5" fill="#6b6b6b">시장 › 종목 검색·관심 종목</text><text x="728" y="134" text-anchor="end" font-size="11.5" fill="#2a73d9">종목 차트 ▸</text><text x="728" y="152" text-anchor="end" font-size="11.5" fill="#6b6b6b">업무 흐름 2: 검색 → 차트 → 주문</text></g><g><rect x="32" y="168" width="408" height="376" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="48" y="192" font-size="13" font-weight="600" fill="#1f1f1f">종목 검색</text><text x="424" y="192" text-anchor="end" font-size="11.5" fill="#6b6b6b">마스터 기준일 —</text><rect x="48" y="204" width="376" height="32" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="60" y="224" fill="#6b6b6b">종목 코드 또는 이름 입력</text><rect x="48" y="248" width="48" height="24" rx="12" fill="#2a73d9" fill-opacity="0.12" stroke="#2a73d9"></rect><text x="72" y="264" text-anchor="middle" font-size="11.5" fill="#1f1f1f">전체</text><rect x="104" y="248" width="60" height="24" rx="12" fill="none" stroke="#b9b6ad"></rect><text x="134" y="264" text-anchor="middle" font-size="11.5" fill="#6b6b6b">KOSPI</text><rect x="172" y="248" width="68" height="24" rx="12" fill="none" stroke="#b9b6ad"></rect><text x="206" y="264" text-anchor="middle" font-size="11.5" fill="#6b6b6b">KOSDAQ</text><text x="48" y="296" font-size="11.5" fill="#6b6b6b">코드</text><text x="112" y="296" font-size="11.5" fill="#6b6b6b">이름</text><text x="216" y="296" font-size="11.5" fill="#6b6b6b">시장</text><text x="272" y="296" font-size="11.5" fill="#6b6b6b">NXT</text><line x1="48" x2="424" y1="304" y2="304" stroke="#e4e2dc"></line><text x="48" y="328" fill="#1f1f1f">005930</text><text x="112" y="328" fill="#1f1f1f">삼성전자</text><text x="216" y="328" fill="#1f1f1f">KOSPI</text><rect x="272" y="315" width="60" height="18" rx="9" fill="none" stroke="#b9b6ad"></rect><text x="302" y="328" text-anchor="middle" font-size="10.5" fill="#1f1f1f">NXT 대상</text><text x="360" y="328" text-anchor="middle" font-size="11.5" fill="#6b6b6b">추가됨</text><text x="424" y="328" text-anchor="end" font-size="11.5" fill="#2a73d9">차트 ▸</text><line x1="48" x2="424" y1="342" y2="342" stroke="#e4e2dc"></line><text x="48" y="366" fill="#1f1f1f">002360</text><text x="112" y="366" fill="#1f1f1f">SH에너지화학</text><text x="216" y="366" font-size="11.5" fill="#6b6b6b">마스터 값</text><text x="272" y="366" font-size="11.5" fill="#1f1f1f">아님</text><rect x="336" y="350" width="48" height="24" rx="6" fill="#2a73d9" fill-opacity="0.12" stroke="#2a73d9" stroke-width="2"></rect><text x="360" y="366" text-anchor="middle" font-weight="600" fill="#1f1f1f">+ 추가</text><text x="424" y="366" text-anchor="end" font-size="11.5" fill="#2a73d9">차트 ▸</text><line x1="48" x2="424" y1="380" y2="380" stroke="#e4e2dc"></line><text x="48" y="404" font-size="11.5" fill="#6b6b6b">NXT 칸: 배지 = 대상 · 아님 = 대상 아님 · — = 마스터에 값 없음</text><text x="48" y="422" font-size="11.5" fill="#6b6b6b">NXT 대상 배지는 시세 구분용이다(KRX·NXT·통합)</text><text x="48" y="440" font-size="11.5" fill="#6b6b6b">모의에서는 NXT 주문이 거부된다(B-02 실측)</text><text x="48" y="458" font-size="11.5" fill="#6b6b6b">NXT 대상은 바뀐다. 마스터 기준일을 카드 위에 보인다</text><text x="48" y="476" font-size="11.5" fill="#6b6b6b">종목 마스터 출처(미확인): KRX Open API 또는 증권사 종목 파일</text><text x="48" y="494" font-size="11.5" fill="#6b6b6b">SH에너지화학 행의 시장·NXT 값은 모양 예시다(실제 값 아님)</text><text x="48" y="512" font-size="11.5" fill="#6b6b6b">행을 누르면 그 종목을 고른 채 종목 차트를 연다</text></g><g><path d="M440 362H448V306H456" fill="none" stroke="#2a73d9" stroke-width="1.25" marker-end="url(#watch-arrow)"></path></g><g><rect x="456" y="168" width="272" height="376" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="472" y="192" font-size="13" font-weight="600" fill="#1f1f1f">관심 종목</text><text x="712" y="192" text-anchor="end" font-size="11.5" fill="#6b6b6b">최대 개수 미정</text><text x="472" y="224" font-size="11.5" fill="#6b6b6b">종목</text><text x="608" y="224" text-anchor="end" font-size="11.5" fill="#6b6b6b">현재가</text><text x="656" y="224" text-anchor="end" font-size="11.5" fill="#6b6b6b">등락</text><text x="688" y="224" text-anchor="middle" font-size="11.5" fill="#6b6b6b">삭제</text><line x1="472" x2="712" y1="232" y2="232" stroke="#e4e2dc"></line><text x="472" y="254" font-size="12.5" font-weight="600" fill="#1f1f1f">삼성전자</text><text x="608" y="254" text-anchor="end" font-size="12.5" fill="#1f1f1f">211,500</text><text x="656" y="254" text-anchor="end" font-size="12.5" fill="#6b6b6b">—</text><rect x="668" y="242" width="40" height="22" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="688" y="257" text-anchor="middle" font-size="11.5" fill="#1f1f1f">삭제</text><text x="472" y="272" font-size="11.5" fill="#6b6b6b">005930 · 10:19 받음</text><line x1="472" x2="712" y1="284" y2="284" stroke="#e4e2dc"></line><text x="472" y="306" font-size="12.5" font-weight="600" fill="#1f1f1f">SH에너지화학</text><text x="608" y="306" text-anchor="end" font-size="12.5" fill="#6b6b6b">—</text><text x="656" y="306" text-anchor="end" font-size="12.5" fill="#6b6b6b">—</text><rect x="668" y="294" width="40" height="22" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="688" y="309" text-anchor="middle" font-size="11.5" fill="#1f1f1f">삭제</text><text x="472" y="324" font-size="11.5" fill="#6b6b6b">002360 · 받기 전</text><line x1="472" x2="712" y1="336" y2="336" stroke="#e4e2dc"></line><rect x="472" y="348" width="240" height="40" rx="6" fill="none" stroke="#b9b6ad" stroke-dasharray="4 4"></rect><text x="592" y="372" text-anchor="middle" font-size="11.5" fill="#6b6b6b">검색에서 추가한 종목이 여기 쌓인다</text><text x="472" y="412" font-size="11.5" fill="#6b6b6b">행을 누르면 종목 차트를 연다</text><text x="472" y="430" font-size="11.5" fill="#6b6b6b">현재가는 H0STCNT0 실시간 구독이다</text><text x="472" y="448" font-size="11.5" fill="#6b6b6b">구독 한도(예제 40개)는 차트·체결통보와</text><text x="472" y="466" font-size="11.5" fill="#6b6b6b">나눠 쓴다. 최대 개수는 미정</text><text x="472" y="484" font-size="11.5" fill="#6b6b6b">장 마감 뒤에는 현재가 칸에 종가 표시</text><text x="472" y="502" font-size="11.5" fill="#6b6b6b">삭제는 관심 종목에서만 뺀다</text><text x="472" y="524" font-size="11.5" font-weight="600" fill="#d23a3a">▲ 상승 빨강</text><text x="560" y="524" font-size="11.5" font-weight="600" fill="#2a73d9">▼ 하락 파랑</text></g></svg>
