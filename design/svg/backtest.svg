<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 760 1130" role="img" aria-label="실행 설정에 미래 정보 차단·익명화를 밝히고, 지표를 장부 비교와 같은 정의로 본다" font-size="12"><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1f1f">실행 설정에 미래 정보 차단·익명화를 밝히고, 지표를 장부 비교와 같은 정의로 본다</text><text x="24" y="50" font-size="11.5" fill="#6b6b6b">와이어프레임 초안 · 모의 주식 계좌 · 값은 자리 표시(—)</text><g><rect x="16" y="64" width="728" height="1042" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect></g><g><rect x="16" y="64" width="728" height="40" rx="8" fill="#ededeb" stroke="#b9b6ad"></rect><text x="380" y="89" text-anchor="middle" fill="#6b6b6b">자동 주문 표시줄 · 변형 1 (켜짐)</text></g><g><text x="32" y="134" font-size="15" font-weight="600" fill="#1f1f1f">백테스트 결과</text><text x="32" y="152" font-size="11.5" fill="#6b6b6b">성과 › 백테스트 결과</text><text x="712" y="134" text-anchor="end" font-size="11.5" fill="#2a73d9">장부 비교·평가 ▸</text><text x="712" y="152" text-anchor="end" font-size="11.5" fill="#6b6b6b">업무 흐름 5 · 같은 전략의 다음 화면</text></g><g><text x="32" y="186" font-size="11.5" fill="#6b6b6b">실행</text><rect x="64" y="168" width="264" height="28" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="76" y="186" fill="#1f1f1f">실행 — · 실행 시각 — ▾</text><text x="344" y="186" font-size="11.5" fill="#6b6b6b">파라미터 버전(valid_from) —</text><text x="712" y="186" text-anchor="end" font-size="11.5" fill="#6b6b6b">이 결과가 ‘백테스트 완료’의 근거</text></g><g><rect x="32" y="212" width="696" height="236" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="48" y="236" font-size="13" font-weight="600" fill="#1f1f1f">실행 설정</text><text x="712" y="236" text-anchor="end" font-size="11.5" fill="#6b6b6b">기본 체결 모델 · 모의보다 보수적 (plan.md 3.9)</text><line x1="48" x2="712" y1="246" y2="246" stroke="#e4e2dc"></line><text x="48" y="268" font-size="11.5" fill="#6b6b6b">전략</text><text x="128" y="268" fill="#1f1f1f">—</text><text x="148" y="268" font-size="11.5" fill="#2a73d9">전략 목록·설정 ▸</text><text x="48" y="292" font-size="11.5" fill="#6b6b6b">기간</text><text x="128" y="292" fill="#1f1f1f">— ~ —</text><text x="48" y="316" font-size="11.5" fill="#6b6b6b">수수료</text><text x="128" y="316" fill="#1f1f1f">0.0142% (2차 자료, 검증하지 않음)</text><text x="48" y="340" font-size="11.5" fill="#6b6b6b">세금(매도)</text><text x="128" y="340" fill="#1f1f1f">0.20% (2차 자료, 검증하지 않음)</text><line x1="344" x2="344" y1="256" y2="348" stroke="#e4e2dc"></line><text x="360" y="268" font-size="11.5" fill="#6b6b6b">지정가</text><text x="440" y="268" fill="#1f1f1f">봉 안에서 가격을 통과했을 때만 체결</text><text x="360" y="292" font-size="11.5" fill="#6b6b6b">시장가</text><text x="440" y="292" fill="#1f1f1f">다음 봉 시가 + 슬리피지 (슬리피지 값 가정)</text><text x="360" y="316" font-size="11.5" fill="#6b6b6b">체결 수량</text><text x="440" y="316" fill="#1f1f1f">봉 거래량의 일정 비율 이하 (비율 미확인)</text><text x="360" y="340" font-size="11.5" fill="#6b6b6b">같은 봉 순서</text><text x="440" y="340" fill="#1f1f1f">손절가·목표가 함께 지나면 손절 먼저(제안)</text><line x1="48" x2="712" y1="356" y2="356" stroke="#e4e2dc"></line><rect x="48" y="368" width="224" height="26" rx="13" fill="#1a9e2a" fill-opacity="0.12" stroke="#1a9e2a"></rect><text x="60" y="385" font-size="11.5" fill="#1f1f1f">미래 정보 차단(available_at): 적용</text><rect x="284" y="368" width="264" height="26" rx="13" fill="#1a9e2a" fill-opacity="0.12" stroke="#1a9e2a"></rect><text x="296" y="385" font-size="11.5" fill="#1f1f1f">jev 입력 익명화(종목명·날짜 제거): 적용</text><text x="564" y="385" font-size="11.5" fill="#1f1f1f">판단 없이 건너뛴 날 —일</text><text x="48" y="414" font-size="11.5" fill="#6b6b6b">건너뛴 날은 Ollama 실패일이다. 그날은 신규 매수·jev 매도 없이 강제 청산만 재생한다 (strategy.md 6.3)</text><text x="48" y="434" font-size="11.5" fill="#6b6b6b">한계: 장중 강제 청산(strategy.md 11.2)을 일봉으로 흉내 낸다</text></g><g><text x="32" y="482" font-size="13" font-weight="600" fill="#1f1f1f">지표 · 모두 비용 차감 후, 장부 비교와 같은 정의</text></g><g><rect x="32" y="494" width="106" height="78" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="44" y="514" font-size="11.5" fill="#6b6b6b">수익률</text><text x="44" y="542" font-size="20" font-weight="600" fill="#1f1f1f">—</text><text x="44" y="562" font-size="11.5" fill="#6b6b6b">운영 —</text></g><g><rect x="150" y="494" width="106" height="78" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="162" y="514" font-size="11.5" fill="#6b6b6b">MDD</text><text x="162" y="542" font-size="20" font-weight="600" fill="#1f1f1f">—</text><text x="162" y="562" font-size="11.5" fill="#6b6b6b">운영 —</text></g><g><rect x="268" y="494" width="106" height="78" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="280" y="514" font-size="11.5" fill="#6b6b6b">샤프 비율</text><text x="280" y="542" font-size="20" font-weight="600" fill="#1f1f1f">—</text><text x="280" y="562" font-size="11.5" fill="#6b6b6b">운영 —</text></g><g><rect x="386" y="494" width="106" height="78" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="398" y="514" font-size="11.5" fill="#6b6b6b">회전율</text><text x="398" y="542" font-size="20" font-weight="600" fill="#1f1f1f">—</text><text x="398" y="562" font-size="11.5" fill="#6b6b6b">운영 —</text></g><g><rect x="504" y="494" width="106" height="78" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="516" y="514" font-size="11.5" fill="#6b6b6b">총 거래 비용</text><text x="516" y="542" font-size="20" font-weight="600" fill="#1f1f1f">—</text><text x="516" y="562" font-size="11.5" fill="#6b6b6b">운영 — (추정)</text></g><g><rect x="622" y="494" width="106" height="78" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="634" y="514" font-size="11.5" fill="#6b6b6b">승률</text><text x="634" y="542" font-size="20" font-weight="600" fill="#1f1f1f">—</text><text x="634" y="562" font-size="11.5" fill="#6b6b6b">운영 —</text></g><text x="32" y="590" font-size="11.5" fill="#6b6b6b">카드 아래 줄은 같은 기간 운영 장부 값. 운영 비용은 KIS 추정치(prsm_tlex_smtl)라 출처가 다르다</text><g><rect x="32" y="606" width="696" height="240" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="48" y="630" font-size="13" font-weight="600" fill="#1f1f1f">자산 곡선 · 기간 시작 대비 수익률(%)</text><line x1="452" x2="476" y1="626" y2="626" stroke="#e8692c" stroke-width="2"></line><text x="482" y="630" font-size="11.5" fill="#1f1f1f">백테스트</text><line x1="548" x2="572" y1="626" y2="626" stroke="#2f9e8f" stroke-width="2"></line><text x="578" y="630" font-size="11.5" fill="#1f1f1f">모의 운용 · 운영 장부</text><rect x="520" y="648" width="192" height="148" fill="#ededeb"></rect><text x="528" y="664" font-size="11.5" fill="#6b6b6b">겹치는 기간</text><text x="48" y="664" font-size="11.5" fill="#6b6b6b">수익률(%)</text><line x1="48" x2="712" y1="776" y2="776" stroke="#e4e2dc" stroke-dasharray="2 4"></line><line x1="48" x2="712" y1="796" y2="796" stroke="#b9b6ad"></line><path d="M48 770L120 752L192 758L264 724L336 734L408 702L480 712L552 680L624 690L712 664" fill="none" stroke="#e8692c" stroke-width="2"></path><path d="M520 696L552 686L600 690L648 676L712 668" fill="none" stroke="#2f9e8f" stroke-width="2"></path><text x="48" y="812" font-size="11.5" fill="#6b6b6b">기간 시작</text><text x="520" y="812" text-anchor="middle" font-size="11.5" fill="#6b6b6b">모의 운용 시작</text><text x="712" y="812" text-anchor="end" font-size="11.5" fill="#6b6b6b">기간 끝</text><text x="48" y="834" font-size="11.5" fill="#6b6b6b">선은 장식(값 없음). 모의 운용은 겹치는 기간만 그리고, 성과 구간 리셋에서 끊어 그린다</text></g><g><rect x="32" y="862" width="696" height="160" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="48" y="886" font-size="13" font-weight="600" fill="#1f1f1f">거래 내역</text><text x="48" y="908" font-size="11.5" fill="#6b6b6b">숫자 · 코드가 계산</text><text x="608" y="908" font-size="11.5" fill="#6b6b6b">판단 · jev</text><line x1="48" x2="584" y1="914" y2="914" stroke="#e4e2dc"></line><line x1="608" x2="712" y1="914" y2="914" stroke="#e4e2dc"></line><text x="48" y="930" font-size="11.5" fill="#6b6b6b">일시</text><text x="100" y="930" font-size="11.5" fill="#6b6b6b">종목</text><text x="156" y="930" font-size="11.5" fill="#6b6b6b">방향</text><text x="200" y="930" font-size="11.5" fill="#6b6b6b">방식</text><text x="252" y="930" font-size="11.5" fill="#6b6b6b">회차</text><text x="296" y="930" font-size="11.5" fill="#6b6b6b">수량</text><text x="340" y="930" font-size="11.5" fill="#6b6b6b">체결가</text><text x="396" y="930" font-size="11.5" fill="#6b6b6b">슬리피지</text><text x="456" y="930" font-size="11.5" fill="#6b6b6b">수수료</text><text x="508" y="930" font-size="11.5" fill="#6b6b6b">세금</text><text x="552" y="930" font-size="11.5" fill="#6b6b6b">손익</text><text x="608" y="930" font-size="11.5" fill="#6b6b6b">매도 사유</text><text x="664" y="930" font-size="11.5" fill="#6b6b6b">BUY 확률</text><line x1="48" x2="712" y1="938" y2="938" stroke="#e4e2dc"></line><text x="48" y="960" fill="#6b6b6b">—</text><text x="100" y="960" fill="#6b6b6b">—</text><text x="156" y="960" fill="#d23a3a">매수</text><text x="200" y="960" fill="#1f1f1f">지정가</text><text x="252" y="960" fill="#6b6b6b">—</text><text x="296" y="960" fill="#6b6b6b">—</text><text x="340" y="960" fill="#6b6b6b">—</text><text x="396" y="960" fill="#6b6b6b">—</text><text x="456" y="960" fill="#6b6b6b">—</text><text x="508" y="960" fill="#6b6b6b">—</text><text x="552" y="960" fill="#6b6b6b">—</text><text x="608" y="960" fill="#6b6b6b">—</text><text x="664" y="960" fill="#6b6b6b">—</text><text x="48" y="986" fill="#6b6b6b">—</text><text x="100" y="986" fill="#6b6b6b">—</text><text x="156" y="986" fill="#2a73d9">매도</text><text x="200" y="986" fill="#1f1f1f">시장가</text><text x="252" y="986" fill="#6b6b6b">—</text><text x="296" y="986" fill="#6b6b6b">—</text><text x="340" y="986" fill="#6b6b6b">—</text><text x="396" y="986" fill="#6b6b6b">—</text><text x="456" y="986" fill="#6b6b6b">—</text><text x="508" y="986" fill="#6b6b6b">—</text><text x="552" y="986" fill="#6b6b6b">—</text><text x="608" y="986" font-size="11.5" fill="#1f1f1f">STOP</text><text x="664" y="986" fill="#6b6b6b">—</text><text x="48" y="1010" font-size="11.5" fill="#6b6b6b">수량·체결가·비용은 위 체결 모델로 코드가 계산한 값이다. 실제 주문이 아니다. 매도 사유는 strategy.md 11.3</text></g><g><rect x="32" y="1038" width="696" height="52" rx="8" fill="#ededeb" stroke="#b9b6ad"></rect><text x="48" y="1059" font-weight="600" fill="#1f1f1f">모의 운용과 숫자가 다를 수 있다</text><text x="48" y="1078" font-size="11.5" fill="#6b6b6b">기본 체결 모델이 모의투자보다 보수적이다. 실전 운영에서는 실측 슬리피지로 가정을 보정한다</text></g></svg>
