<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 760 424" role="img" aria-label="로그인은 이메일과 비밀번호 한 번으로 끝나고, 자동 주문 표시줄은 로그인 뒤에 나온다" font-size="12"><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1f1f">로그인은 이메일과 비밀번호 한 번으로 끝나고, 자동 주문 표시줄은 로그인 뒤에 나온다</text><text x="24" y="50" font-size="11.5" fill="#6b6b6b">와이어프레임 초안 · 화면 틀 없이 가운데 카드 · 상태는 본문 표</text><g><rect x="16" y="64" width="728" height="336" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect></g><g><text x="32" y="92" font-size="11.5" fill="#6b6b6b">자동 주문 표시줄 없음</text><text x="32" y="108" font-size="11.5" fill="#6b6b6b">(로그인 전 화면)</text><text x="32" y="136" font-size="11.5" fill="#6b6b6b">시도 제한 없음</text><text x="32" y="152" font-size="11.5" fill="#6b6b6b">(127.0.0.1 전용)</text><text x="32" y="180" font-size="11.5" fill="#6b6b6b">KIS 데이터 없음</text></g><g><rect x="230" y="96" width="300" height="276" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="246" y="130" font-size="13" font-weight="600" fill="#1f1f1f">stock 로그인</text></g><g><text x="246" y="172" font-size="11.5" fill="#6b6b6b">이메일</text><rect x="246" y="180" width="268" height="32" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="258" y="200" font-size="11.5" fill="#6b6b6b">이메일 입력</text></g><g><text x="246" y="232" font-size="11.5" fill="#6b6b6b">비밀번호</text><rect x="246" y="240" width="268" height="32" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="258" y="260" font-size="11.5" fill="#6b6b6b">비밀번호 입력 (가려 표시)</text></g><g><rect x="246" y="284" width="268" height="28" rx="6" fill="#d23a3a" fill-opacity="0.12" stroke="#d23a3a" stroke-dasharray="4 4"></rect><text x="258" y="302" font-size="11.5" fill="#1f1f1f">이메일 또는 비밀번호가 맞지 않습니다</text></g><g><rect x="246" y="324" width="268" height="32" rx="6" fill="#2a73d9" fill-opacity="0.12" stroke="#2a73d9" stroke-width="2"></rect><text x="380" y="344" text-anchor="middle" font-weight="600" fill="#1f1f1f">로그인</text></g><g><line x1="530" x2="548" y1="298" y2="298" stroke="#e4e2dc"></line><text x="556" y="290" font-size="11.5" fill="#6b6b6b">메시지 자리: 틀림·서버 무응답·</text><text x="556" y="306" font-size="11.5" fill="#6b6b6b">세션 만료 안내, 문구는 가정</text></g><g><line x1="530" x2="548" y1="340" y2="340" stroke="#e4e2dc"></line><text x="556" y="336" font-size="11.5" fill="#6b6b6b">Next가 Spring에 확인 요청</text><text x="556" y="352" font-size="11.5" fill="#6b6b6b">성공: 계좌 없으면 계좌 연결,</text><text x="556" y="368" font-size="11.5" fill="#6b6b6b">있으면 대시보드</text><text x="556" y="384" font-size="11.5" fill="#6b6b6b">확인 중에는 버튼 비활성</text></g></svg>
