<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 760 796" role="img" aria-label="고른 종목·방향의 미체결만, 취소될 주문을 먼저 보고 취소한다" font-size="12"><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1f1f">고른 종목·방향의 미체결만, 취소될 주문을 먼저 보고 취소한다</text><text x="24" y="50" font-size="11.5" fill="#6b6b6b">와이어프레임 · M4 · 모의 주식 계좌 · 취소 예시는 가상 예시(20620·22608은 실측에서 모두 체결됨)</text><g><rect x="16" y="64" width="728" height="708" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect></g><g><rect x="16" y="64" width="728" height="36" rx="8" fill="#ededeb" stroke="#e4e2dc"></rect><text x="380" y="86" text-anchor="middle" font-size="11.5" fill="#6b6b6b">자동 주문 표시줄 · 변형 2 (꺼짐 · 사람이 끔) · 켜진 때는 변형 1</text></g><g><text x="32" y="128" font-size="15" font-weight="600" fill="#1f1f1f">미체결 주문 취소</text><text x="32" y="146" font-size="11.5" fill="#6b6b6b">매매 › 미체결 주문 취소 · 처음에는 아무것도 고르지 않은 상태</text><text x="728" y="128" text-anchor="end" font-size="11.5" fill="#2a73d9">자동 주문 켜기·끄기 ▸  대시보드 ▸</text></g><g><rect x="32" y="160" width="336" height="264" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="48" y="186" font-size="13" font-weight="600" fill="#1f1f1f">미체결이 있는 종목</text><text x="48" y="214" font-size="11.5" fill="#6b6b6b">종목</text><circle cx="218" cy="210" r="3" fill="#d23a3a"></circle><text x="224" y="214" font-size="11.5" fill="#6b6b6b">매수</text><circle cx="290" cy="210" r="3" fill="#2a73d9"></circle><text x="296" y="214" font-size="11.5" fill="#6b6b6b">매도</text><line x1="48" x2="352" y1="224" y2="224" stroke="#e4e2dc"></line><text x="48" y="250" font-size="13" fill="#1f1f1f">SH에너지화학</text><g><rect x="224" y="239" width="14" height="14" rx="3" fill="none" stroke="#e4e2dc" stroke-width="1.25"></rect></g><text x="244" y="250" font-size="11.5" fill="#6b6b6b">0건</text><g><rect x="296" y="239" width="14" height="14" rx="3" fill="none" stroke="#2a73d9" stroke-width="2"></rect><path d="M299 246l3 3l5 -6" fill="none" stroke="#2a73d9" stroke-width="2"></path></g><text x="316" y="250" font-size="11.5" fill="#1f1f1f">1건</text><text x="48" y="270" font-size="11.5" fill="#6b6b6b">002360 · 매도 잔량 576주 · 낸 쪽 수동</text><line x1="48" x2="352" y1="284" y2="284" stroke="#e4e2dc"></line><text x="48" y="310" font-size="13" fill="#6b6b6b">종목 B · 가상 예시</text><g><rect x="224" y="299" width="14" height="14" rx="3" fill="none" stroke="#e4e2dc" stroke-width="1.25"></rect></g><text x="244" y="310" font-size="11.5" fill="#6b6b6b">—</text><g><rect x="296" y="299" width="14" height="14" rx="3" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect></g><text x="316" y="310" font-size="11.5" fill="#6b6b6b">—</text><text x="48" y="330" font-size="11.5" fill="#6b6b6b">매도 잔량 — · 낸 쪽</text><text x="160" y="330" font-size="11.5" font-weight="600" fill="#d23a3a">강제 청산</text><line x1="48" x2="352" y1="344" y2="344" stroke="#e4e2dc"></line><text x="48" y="368" font-size="11.5" fill="#6b6b6b">처음에는 아무것도 체크하지 않는다 (위는 고른 뒤)</text><text x="48" y="386" font-size="11.5" fill="#6b6b6b">일괄 취소 버튼은 없다</text><text x="48" y="404" font-size="11.5" fill="#6b6b6b">미체결이 없는 방향은 흐린 칸</text></g><g><rect x="384" y="160" width="344" height="264" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="400" y="186" font-size="13" font-weight="600" fill="#1f1f1f">취소될 주문</text><text x="712" y="186" text-anchor="end" font-size="11.5" fill="#6b6b6b">주문 단위 · 펼치면 번호별</text><text x="400" y="206" font-size="11.5" fill="#6b6b6b">기준 hh:mm:ss · 통보 누계 · 실행 직전 다시 읽음</text><text x="400" y="224" font-size="11.5" fill="#6b6b6b">가상 예시 · SH에너지화학 매도를 골랐을 때</text><g><rect x="400" y="232" width="312" height="40" rx="8" fill="#2a73d9" fill-opacity="0.12" stroke="#2a73d9" stroke-width="1.5"></rect><text x="412" y="248" font-weight="600" fill="#1f1f1f">▾ SH에너지화학 · 매도 · 시장가 · 수동</text><text x="412" y="265" font-size="11.5" fill="#1f1f1f">주문 600 · 체결 24 · 취소 0 · 잔량 576</text><rect x="416" y="278" width="296" height="24" rx="6" fill="none" stroke="#2a73d9" stroke-width="1.25"></rect><text x="428" y="294" font-size="11.5" fill="#1f1f1f">20620 원주문 · 잔량 276주 취소</text><rect x="416" y="306" width="296" height="24" rx="6" fill="none" stroke="#2a73d9" stroke-width="1.25"></rect><text x="428" y="322" font-size="11.5" fill="#1f1f1f">22608 정정 · 잔량 300주 취소</text></g><text x="400" y="348" font-size="11.5" fill="#6b6b6b">취소는 각 번호의 남은 수량만 취소한다</text><text x="400" y="364" font-size="11.5" fill="#6b6b6b">미리보기 뒤에 새로 낸 주문은 포함하지 않는다</text><rect x="400" y="376" width="312" height="36" rx="6" fill="#f2a516" fill-opacity="0.12" stroke="#f2a516" stroke-width="2"></rect><text x="556" y="399" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1f">취소 실행 (번호 2개) ▸ 확인 대화상자</text></g><g><rect x="32" y="440" width="696" height="48" rx="8" fill="#d23a3a" fill-opacity="0.12" stroke="#d23a3a"></rect><text x="48" y="460" font-size="13" font-weight="600" fill="#1f1f1f">강제 청산 매도를 고르면 경고</text><text x="48" y="478" font-size="11.5" fill="#1f1f1f">손절 주문이 사라진다. 자동 주문이 꺼진 동안에는 다시 나가지 않는다. 확인 대화상자에도 같은 경고</text></g><g><rect x="32" y="504" width="696" height="184" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="48" y="528" font-size="13" font-weight="600" fill="#1f1f1f">실행 결과 · 가상 예시</text><text x="712" y="528" text-anchor="end" font-size="11.5" fill="#6b6b6b">번호별로 차례로 보냄 (모의 초당 2건 한도) · 2/2 전송</text><text x="48" y="554" font-size="11.5" fill="#6b6b6b">번호</text><text x="140" y="554" font-size="11.5" fill="#6b6b6b">미리보기 잔량</text><text x="264" y="554" font-size="11.5" fill="#6b6b6b">실제 취소 수량</text><text x="440" y="554" font-size="11.5" fill="#6b6b6b">결과</text><line x1="48" x2="712" y1="562" y2="562" stroke="#e4e2dc"></line><text x="48" y="584" fill="#1f1f1f">20620</text><text x="140" y="584" fill="#1f1f1f">276주</text><text x="264" y="584" fill="#1f1f1f">276주</text><text x="440" y="584" font-weight="600" fill="#1a9e2a">취소 완료</text><text x="48" y="608" fill="#1f1f1f">22608</text><text x="140" y="608" fill="#1f1f1f">300주</text><text x="264" y="608" fill="#f2a516" font-weight="600">직전 체결로 줄어듦</text><text x="440" y="608" font-weight="600" fill="#1a9e2a">취소 완료</text><line x1="48" x2="712" y1="620" y2="620" stroke="#e4e2dc"></line><text x="48" y="640" font-size="11.5" fill="#6b6b6b">결과: 취소 완료 · 실패(KIS 메시지) · 응답 없음 → 확인 중(조회로 확정)</text><text x="48" y="666" font-size="11.5" fill="#6b6b6b">취소 직전에 체결된 수량은 취소되지 않아 미리보기보다 적을 수 있다</text><rect x="520" y="648" width="192" height="28" rx="6" fill="none" stroke="#2a73d9"></rect><text x="616" y="666" text-anchor="middle" font-size="11.5" fill="#2a73d9">실패·확인 중 번호 다시 고르기</text></g><g><rect x="32" y="704" width="696" height="52" rx="8" fill="#ededeb" stroke="#e4e2dc"></rect><text x="48" y="726" font-size="13" font-weight="600" fill="#1f1f1f">자동 주문 끄기와는 별개 버튼이다</text><text x="48" y="744" font-size="11.5" fill="#6b6b6b">위 표시줄의 자동 주문 끄기는 새 자동 주문만 막고, 이 화면은 이미 낸 미체결만 취소한다</text></g></svg>
