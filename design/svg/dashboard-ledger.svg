<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 760 964" role="img" aria-label="원장 현금이 맨 위에, 그 근거인 원장 내역이 맨 아래에 있다" font-size="12"><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1f1f">원장 현금이 맨 위에, 그 근거인 원장 내역이 맨 아래에 있다</text><text x="24" y="50" font-size="11.5" fill="#6b6b6b">와이어프레임 초안 · 모의 주식 계좌 · 값은 B-02 실측 예시 또는 자리 표시</text><g><rect x="16" y="64" width="728" height="876" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect></g><g><rect x="16" y="64" width="728" height="40" rx="8" fill="#ededeb" stroke="#b9b6ad"></rect><text x="380" y="88" text-anchor="middle" fill="#6b6b6b">자동 주문 표시줄 · 변형 7 (M1~M3, 자동 주문 없음)</text></g><g><text x="32" y="132" font-size="15" font-weight="600" fill="#1f1f1f">대시보드</text><text x="32" y="150" font-size="11.5" fill="#6b6b6b">홈 › 대시보드</text><text x="728" y="132" text-anchor="end" font-size="11.5" fill="#2a73d9">주문 ▸  종목 차트 ▸</text><text x="728" y="150" text-anchor="end" font-size="11.5" fill="#6b6b6b">주문 뒤 반영 확인, 보유 종목 보기</text></g><g><rect x="32" y="164" width="216" height="104" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="48" y="188" font-size="11.5" fill="#6b6b6b">원장 현금</text><text x="48" y="220" font-size="20" font-weight="600" fill="#1f1f1f">99,999,306원</text><text x="48" y="240" font-size="11.5" fill="#6b6b6b">시작 예수금 100,000,000원</text><text x="48" y="256" font-size="11.5" fill="#6b6b6b">KIS prvs_rcdl_excc_amt —</text></g><g><rect x="272" y="164" width="216" height="104" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="288" y="188" font-size="11.5" fill="#6b6b6b">진행 중 묶음</text><text x="472" y="188" text-anchor="end" font-size="11.5" fill="#2a73d9">미체결 ▸</text><text x="288" y="220" font-size="20" font-weight="600" fill="#1f1f1f">—</text><text x="288" y="240" font-size="11.5" fill="#6b6b6b">미체결이 묶은 돈 · 원장 밖</text><text x="288" y="256" font-size="11.5" fill="#6b6b6b">주문 가능 = 원장 현금 − 묶음</text></g><g><rect x="512" y="164" width="216" height="104" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="528" y="188" font-size="11.5" fill="#6b6b6b">보유 평가</text><text x="528" y="220" font-size="20" font-weight="600" fill="#1f1f1f">—</text><text x="528" y="240" font-size="11.5" fill="#6b6b6b">보유 수량 × 현재가</text><text x="528" y="256" font-size="11.5" fill="#6b6b6b">현재가 실시간 · 받은 시각 —</text></g><g><rect x="32" y="284" width="696" height="144" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="48" y="308" font-size="13" font-weight="600" fill="#1f1f1f">보유 종목 (positions)</text><text x="48" y="336" font-size="11.5" fill="#6b6b6b">종목코드</text><text x="120" y="336" font-size="11.5" fill="#6b6b6b">종목명</text><text x="256" y="336" font-size="11.5" fill="#6b6b6b">보유 수량</text><text x="336" y="336" font-size="11.5" fill="#6b6b6b">평균 단가</text><text x="432" y="336" font-size="11.5" fill="#6b6b6b">현재가</text><text x="512" y="336" font-size="11.5" fill="#6b6b6b">평가 손익</text><text x="584" y="336" font-size="11.5" fill="#6b6b6b">비중</text><text x="640" y="336" font-size="11.5" fill="#6b6b6b">이동</text><line x1="48" x2="712" y1="344" y2="344" stroke="#e4e2dc"></line><text x="48" y="366" fill="#1f1f1f">002360</text><text x="120" y="366" fill="#1f1f1f">SH에너지화학</text><text x="256" y="366" fill="#6b6b6b">—</text><text x="336" y="366" fill="#6b6b6b">—</text><text x="432" y="366" fill="#6b6b6b">—</text><text x="512" y="366" fill="#6b6b6b">—</text><text x="584" y="366" fill="#6b6b6b">—</text><text x="640" y="366" font-size="11.5" fill="#2a73d9">차트·주문 ▸</text><text x="48" y="390" fill="#1f1f1f">005930</text><text x="120" y="390" fill="#1f1f1f">삼성전자</text><text x="256" y="390" fill="#6b6b6b">—</text><text x="336" y="390" fill="#6b6b6b">—</text><text x="432" y="390" fill="#6b6b6b">—</text><text x="512" y="390" fill="#6b6b6b">—</text><text x="584" y="390" fill="#6b6b6b">—</text><text x="640" y="390" font-size="11.5" fill="#2a73d9">차트·주문 ▸</text><t