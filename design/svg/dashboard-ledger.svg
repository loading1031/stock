="268" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="48" y="680" font-size="13" font-weight="600" fill="#1f1f1f">금액 원장 내역 (cash_ledger)</text><text x="712" y="680" text-anchor="end" font-size="11.5" fill="#6b6b6b">유형 ▾  기간 ▾</text><text x="48" y="708" font-size="11.5" fill="#6b6b6b">유형</text><text x="256" y="708" text-anchor="end" font-size="11.5" fill="#6b6b6b">금액(원)</text><text x="340" y="708" font-size="11.5" fill="#6b6b6b">주문 참조</text><text x="460" y="708" font-size="11.5" fill="#6b6b6b">시각</text><text x="556" y="708" font-size="11.5" fill="#6b6b6b">비고</text><line x1="48" x2="712" y1="716" y2="716" stroke="#e4e2dc"></line><text x="48" y="738" fill="#1f1f1f">입금</text><text x="256" y="738" text-anchor="end" fill="#1f1f1f">+100,000,000</text><text x="340" y="738" fill="#6b6b6b">—</text><text x="460" y="738" fill="#6b6b6b">—</text><text x="556" y="738" font-size="11.5" fill="#6b6b6b">모의 계좌 시작 예수금</text><text x="48" y="762" fill="#d23a3a">매수 대금</text><text x="256" y="762" text-anchor="end" fill="#6b6b6b">—</text><text x="340" y="762" font-size="11.5" fill="#2a73d9">주문 체인 ▸</text><text x="460" y="762" fill="#6b6b6b">—</text><text x="556" y="762" font-size="11.5" fill="#6b6b6b">끝난 매수 주문</text><text x="48" y="786" fill="#d23a3a">매수 대금</text><text x="256" y="786" text-anchor="end" fill="#6b6b6b">—</text><text x="340" y="786" font-size="11.5" fill="#2a73d9">주문 체인 ▸</text><text x="460" y="786" fill="#6b6b6b">—</text><text x="556" y="786" font-size="11.5" fill="#6b6b6b">끝난 매수 주문</text><text x="48" y="810" fill="#2a73d9">매도 대금</text><text x="256" y="810" text-anchor="end" fill="#6b6b6b">—</text><text x="340" y="810" font-size="11.5" fill="#2a73d9">주문 체인 ▸</text><text x="460" y="810" fill="#6b6b6b">—</text><text x="556" y="810" font-size="11.5" fill="#6b6b6b">끝난 매도 주문</text><text x="48" y="834" fill="#1f1f1f">제비용(추정)</text><text x="256" y="834" text-anchor="end" fill="#1f1f1f">−944</text><text x="340" y="834" fill="#6b6b6b">—</text><text x="460" y="834" fill="#6b6b6b">—</text><text x="556" y="834" font-size="11.5" fill="#6b6b6b">수수료+세금 합, 나눔 미확인</text><text x="48" y="858" fill="#1f1f1f">보정</text><text x="256" y="858" text-anchor="end" fill="#6b6b6b">—</text><text x="340" y="858" font-size="11.5" fill="#2a73d9">대사 결과 ▸</text><text x="460" y="858" fill="#6b6b6b">—</text><text x="556" y="858" font-size="11.5" fill="#6b6b6b">대사 보정 (M4부터)</text><line x1="48" x2="712" y1="870" y2="870" stroke="#e4e2dc"></line><text x="48" y="890" font-size="11.5" fill="#6b6b6b">끝난 주문만 원장 행이 된다. 진행 중 주문은 위 '진행 중 묶음'에 따로 보인다.</text><text x="48" y="908" font-size="11.5" fill="#6b6b6b">B-02 실측: 100,000,000원 → 99,999,306원 = 매매차익 +250원 − 추정 제비용 944원(매수 2건+매도 1건 합)</text></g></svg>
