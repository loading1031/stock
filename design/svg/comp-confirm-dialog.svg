<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 760 416" role="img" aria-label="되돌릴 수 없는 동작은 무엇에 어떤 결과가 나는지 보이고 기본 초점은 취소에 둔다" font-size="12"><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1f1f">되돌릴 수 없는 동작은 결과를 요약해 보이고, 기본 초점은 취소에 둔다</text><text x="24" y="50" font-size="11.5" fill="#6b6b6b">컴포넌트 · 확인 대화상자 · 예시 두 가지, 값은 자리 표시</text><g><rect x="24" y="72" width="344" height="300" rx="10" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="40" y="104" font-size="15" font-weight="600" fill="#1f1f1f">매수 주문 확인</text><text x="40" y="124" font-size="11.5" fill="#6b6b6b">보내면 되돌릴 수 없다. 정정·취소는 새 주문이다</text><text x="40" y="156" font-size="11.5" fill="#6b6b6b">계좌</text><text x="144" y="156" fill="#1f1f1f">모의 · 주식</text><text x="40" y="180" font-size="11.5" fill="#6b6b6b">종목</text><text x="144" y="180" fill="#1f1f1f">SH에너지화학 002360</text><text x="40" y="204" font-size="11.5" fill="#6b6b6b">주문</text><text x="144" y="204" fill="#1f1f1f">매수 · 지정가 · KRX</text><text x="40" y="228" font-size="11.5" fill="#6b6b6b">가격 × 수량</text><text x="144" y="228" fill="#1f1f1f">— 원 × — 주</text><text x="40" y="252" font-size="11.5" fill="#6b6b6b">묶을 금액</text><text x="144" y="252" fill="#1f1f1f">— 원 (수수료 포함 추정)</text><rect x="40" y="268" width="312" height="32" rx="6" fill="#f2a516" fill-opacity="0.12" stroke="#f2a516"></rect><text x="52" y="288" font-size="11.5" fill="#1f1f1f">자동 주문 꺼짐일 때만 — 수동 주문을 한 번 더 확인한다</text><rect x="40" y="320" width="144" height="36" rx="6" fill="none" stroke="#2a73d9" stroke-width="2"></rect><text x="112" y="343" text-anchor="middle" fill="#1f1f1f">취소 · 기본 초점</text><rect x="200" y="320" width="152" height="36" rx="6" fill="#d23a3a" fill-opacity="0.12" stroke="#d23a3a"></rect><text x="276" y="343" text-anchor="middle" font-weight="600" fill="#1f1f1f">매수 주문 보내기</text></g><g><rect x="392" y="72" width="344" height="300" rx="10" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="408" y="104" font-size="15" font-weight="600" fill="#1f1f1f">리스크 한도 변경 확인</text><text x="408" y="124" font-size="11.5" fill="#6b6b6b">느슨해지는 값은 경고색으로 보인다</text><text x="408" y="156" font-size="11.5" fill="#6b6b6b">항목</text><text x="540" y="156" font-size="11.5" fill="#6b6b6b">지금</text><text x="628" y="156" font-size="11.5" fill="#6b6b6b">바꿀 값</text><line x1="408" x2="720" y1="164" y2="164" stroke="#e4e2dc"></line><text x="408" y="188" fill="#1f1f1f">주문당 최대 금액</text><text x="540" y="188" fill="#1f1f1f">1,000,000원</text><text x="628" y="188" fill="#f2a516" font-weight="600">— · 느슨해짐</text><text x="408" y="212" fill="#1f1f1f">종목당 최대 비중</text><text x="540" y="212" fill="#1f1f1f">20%</text><text x="628" y="212" fill="#1a9e2a" font-weight="600">— · 조여짐</text><text x="408" y="244" font-size="11.5" fill="#6b6b6b">지금 값은 plan.md 3.7 예시값</text><text x="408" y="262" font-size="11.5" fill="#6b6b6b">저장한 한도는 다음 주문부터 적용 (가정)</text><rect x="408" y="276" width="312" height="32" rx="6" fill="#f2a516" fill-opacity="0.12" stroke="#f2a516"></rect><text x="420" y="296" font-size="11.5" fill="#1f1f1f">한도가 느슨해진다 — 바뀐 값을 다시 확인한다</text><rect x="408" y="320" width="144" height="36" rx="6" fill="none" stroke="#2a73d9" stroke-width="2"></rect><text x="480" y="343" text-anchor="middle" fill="#1f1f1f">취소 · 기본 초점</text><rect x="568" y="320" width="152" height="36" rx="6" fill="#f2a516" fill-opacity="0.12" stroke="#f2a516"></rect><text x="644" y="343" text-anchor="middle" font-weight="600" fill="#1f1f1f">변경 저장</text></g><text x="24" y="400" font-size="11.5" fill="#6b6b6b">실행 버튼 색은 동작의 성격을 따른다: 매수 빨강, 매도 파랑, 위험한 변경 경고색. 쓰는 곳은 아래 표</text></svg>
