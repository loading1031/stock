<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 760 820" role="img" aria-label="계좌는 종류마다 한 줄씩 등록하고 키와 계좌번호는 가려서 보인다" font-size="12"><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1f1f">계좌는 종류마다 한 줄씩 등록하고, 키·계좌번호는 가려서 보인다</text><text x="24" y="50" font-size="11.5" fill="#6b6b6b">와이어프레임 초안 · 모의 주식 계좌 · 값은 B-02 실측 예시 또는 자리 표시</text><g><rect x="16" y="64" width="728" height="732" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect></g><g><rect x="16" y="64" width="728" height="40" rx="8" fill="#ededeb" stroke="#b9b6ad"></rect><text x="380" y="88" text-anchor="middle" fill="#6b6b6b">자동 주문 표시줄 · 변형 7 (M1~M3, 시세: 조회만)</text></g><g><text x="32" y="132" font-size="15" font-weight="600" fill="#1f1f1f">계좌 연결</text><text x="32" y="150" font-size="11.5" fill="#6b6b6b">관리 › 계좌 연결</text><text x="728" y="132" text-anchor="end" font-size="11.5" fill="#2a73d9">대시보드 ▸</text><text x="728" y="150" text-anchor="end" font-size="11.5" fill="#6b6b6b">첫 등록을 마치면 대시보드로</text></g><g><rect x="32" y="164" width="696" height="104" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="48" y="184" font-size="11.5" fill="#6b6b6b">알림 자리</text><circle cx="54" cy="200" r="5" fill="#d23a3a"></circle><text x="68" y="204" fill="#1f1f1f">토큰 발급 실패 · 계좌 이름 — 바로 알린다 (해지·만료의 첫 증상일 수 있다)</text><text x="712" y="204" text-anchor="end" font-size="11.5" fill="#2a73d9">해당 행 ▸</text><circle cx="54" cy="222" r="5" fill="#f2a516"></circle><text x="68" y="226" fill="#1f1f1f">만료 2주 전 · 계좌 이름 · 만료일 — (모의 계좌 만료 기간은 미확인)</text><text x="712" y="226" text-anchor="end" font-size="11.5" fill="#2a73d9">해당 행 ▸</text><circle cx="54" cy="244" r="5" fill="#f2a516"></circle><text x="68" y="248" fill="#1f1f1f">월 1회 KIS 앱 직접 접속 상기 — 3개월 미접속 해지 대비</text></g><g><rect x="32" y="284" width="696" height="156" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="48" y="310" font-size="13" font-weight="600" fill="#1f1f1f">등록된 계좌</text><rect x="616" y="294" width="96" height="28" rx="6" fill="none" stroke="#2a73d9"></rect><text x="664" y="312" text-anchor="middle" fill="#1f1f1f">+ 계좌 추가</text><text x="48" y="340" font-size="11.5" fill="#6b6b6b">증권사</text><text x="92" y="340" font-size="11.5" fill="#6b6b6b">환경</text><text x="136" y="340" font-size="11.5" fill="#6b6b6b">계좌 종류</text><text x="208" y="340" font-size="11.5" fill="#6b6b6b">계좌번호</text><text x="296" y="340" font-size="11.5" fill="#6b6b6b">App Key</text><text x="368" y="340" font-size="11.5" fill="#6b6b6b">만료일</text><text x="424" y="340" font-size="11.5" fill="#6b6b6b">토큰</text><text x="584" y="340" font-size="11.5" fill="#6b6b6b">동작</text><line x1="48" x2="712" y1="348" y2="348" stroke="#e4e2dc"></line><text x="48" y="370" fill="#1f1f1f">KIS</text><text x="92" y="370" fill="#1f1f1f">모의</text><text x="136" y="370" fill="#1f1f1f">주식</text><text x="208" y="370" fill="#1f1f1f">••••••••-01</text><text x="296" y="370" fill="#1f1f1f">••••••••</text><text x="368" y="370" fill="#6b6b6b">—</text><circle cx="428" cy="366" r="4" fill="#1a9e2a"></circle><text x="438" y="370" font-size="11.5" fill="#1f1f1f">유효 · 10-16 08:51까지</text><text x="584" y="370" font-size="11.5" fill="#2a73d9">키 교체 · 만료일 · 중지</text><text x="48" y="398" fill="#1f1f1f">KIS</text><text x="92" y="398" fill="#1f1f1f">모의</text><text x="136" y="398" fill="#1f1f1f">선물옵션</text><text x="208" y="398" fill="#1f1f1f">••••••••-03</text><text x="296" y="398" fill="#1f1f1f">••••••••</text><text x="368" y="398" fill="#6b6b6b">—</text><circle cx="428" cy="394" r="4" fill="#d23a3a"></circle><text x="438" y="398" font-size="11.5" fill="#1f1f1f">실패 · 계좌·앱키 불일치</text><text x="584" y="398" font-size="11.5" fill="#2a73d9">키 교체 · 만료일 · 중지</text><text x="48" y="426" font-size="11.5" fill="#6b6b6b">토큰 상태: 유효·만료·실패 · 토큰은 24시간 유효, 발급은 1분당 1회 · 만료일 예시는 미확인이라 비움</text></g><g><rect x="32" y="456" width="696" height="324" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="48" y="482" font-size="13" font-weight="600" fill="#1f1f1f">계좌 추가</text><text x="48" y="520" font-size="11.5" fill="#6b6b6b">증권사</text><rect x="136" y="502" width="216" height="28" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="148" y="520" fill="#1f1f1f">KIS ▾</text><text x="384" y="520" font-size="11.5" fill="#6b6b6b">환경</text><rect x="472" y="502" width="80" height="28" rx="6" fill="#2a73d9" fill-opacity="0.12" stroke="#2a73d9"></rect><text x="512" y="520" text-anchor="middle" font-weight="600" fill="#1f1f1f">모의</text><rect x="560" y="502" width="152" height="28" rx="6" fill="#ededeb" stroke="#e4e2dc" stroke-dasharray="4 4"></rect><text x="636" y="520" text-anchor="middle" font-size="11.5" fill="#6b6b6b">실전 · M7 전 비활성</text><text x="48" y="560" font-size="11.5" fill="#6b6b6b">계좌 종류</text><rect x="136" y="542" width="80" height="28" rx="6" fill="#2a73d9" fill-opacity="0.12" stroke="#2a73d9"></rect><text x="176" y="560" text-anchor="middle" font-weight="600" fill="#1f1f1f">주식</text><rect x="224" y="542" width="96" height="28" rx="6" fill="none" fill-opacity="1" stroke="#b9b6ad"></rect><text x="272" y="560" text-anchor="middle" fill="#6b6b6b">선물옵션</text><text x="384" y="560" font-size="11.5" fill="#6b6b6b">계좌번호</text><rect x="472" y="542" width="160" height="28" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="484" y="560" font-size="11.5" fill="#6b6b6b">앞 8자리</text><text x="640" y="560" text-anchor="middle" fill="#6b6b6b">-</text><rect x="648" y="542" width="64" height="28" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="680" y="560" text-anchor="middle" font-size="11.5" fill="#6b6b6b">뒤 2자리</text><text x="48" y="600" font-size="11.5" fill="#6b6b6b">App Key</text><rect x="136" y="582" width="216" height="28" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="148" y="600" font-size="11.5" fill="#6b6b6b">키 입력 · 가려서 보임</text><text x="384" y="600" font-size="11.5" fill="#6b6b6b">App Secret</text><rect x="472" y="582" width="240" height="28" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="484" y="600" font-size="11.5" fill="#6b6b6b">시크릿 입력 · 가려서 보임</text><text x="48" y="640" font-size="11.5" fill="#6b6b6b">HTS 아이디</text><rect x="136" y="622" width="216" height="28" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="148" y="640" font-size="11.5" fill="#6b6b6b">체결통보 구독 키</text><text x="384" y="640" font-size="11.5" fill="#6b6b6b">만료일</text><rect x="472" y="622" width="240" height="28" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="484" y="640" font-size="11.5" fill="#6b6b6b">날짜 선택 · 모의 계좌는 필수</text><rect x="48" y="660" width="664" height="40" rx="8" fill="#f2a516" fill-opacity="0.12" stroke="#f2a516"></rect><text x="64" y="684" fill="#1f1f1f">환경은 등록 뒤 바꿀 수 없다. 다른 환경은 계좌를 새로 등록한다(가정)</text><text x="48" y="732" font-size="11.5" fill="#6b6b6b">앱키는 계좌마다 따로 받는다 (주식 모의 / 선물옵션 모의)</text><rect x="560" y="714" width="152" height="28" rx="6" fill="#2a73d9" fill-opacity="0.12" stroke="#2a73d9" stroke-width="2"></rect><text x="636" y="733" text-anchor="middle" font-weight="600" fill="#1f1f1f">계좌 등록</text><text x="712" y="764" text-anchor="end" font-size="11.5" fill="#6b6b6b">누르면 확인 대화상자 (컴포넌트) · 등록 중에는 버튼 비활성</text></g></svg>
