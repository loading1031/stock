<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 760 1148" role="img" aria-label="전략은 초안부터 순서대로 올라가고, 정지하면 그 전략의 새 주문만 멈춘다" font-size="12"><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1f1f">전략은 초안부터 순서대로 올라가고, 정지하면 그 전략의 새 주문만 멈춘다</text><text x="24" y="50" font-size="11.5" fill="#6b6b6b">와이어프레임 초안 · 모의 주식 계좌 · 값은 B-02 실측 예시 또는 자리 표시</text><g><rect x="16" y="64" width="728" height="1060" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect></g><g><rect x="16" y="64" width="728" height="40" rx="8" fill="#ededeb"></rect><text x="380" y="88" text-anchor="middle" fill="#6b6b6b">자동 주문 표시줄 · 변형 1 (켜짐)</text></g><g><text x="32" y="144" font-size="15" font-weight="600" fill="#1f1f1f">전략 목록·설정</text><text x="592" y="144" text-anchor="end" fill="#2a73d9">백테스트 결과 ▸</text><text x="712" y="144" text-anchor="end" fill="#2a73d9">장부 비교·평가 ▸</text><text x="32" y="166" font-size="11.5" fill="#6b6b6b">상태 이름은 상태 표시명을 따르고, 코드 값은 상세에서만 보인다</text></g><g><rect x="32" y="180" width="696" height="236" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="48" y="206" font-size="13" font-weight="600" fill="#1f1f1f">전략 목록</text><rect x="632" y="188" width="80" height="28" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="672" y="206" text-anchor="middle" fill="#1f1f1f">+ 새 전략</text><text x="48" y="234" font-size="11.5" fill="#6b6b6b">이름</text><text x="220" y="234" font-size="11.5" fill="#6b6b6b">상태</text><text x="340" y="234" font-size="11.5" fill="#6b6b6b">계좌</text><text x="440" y="234" font-size="11.5" fill="#6b6b6b">근거</text><text x="600" y="234" font-size="11.5" fill="#6b6b6b">동작</text><line x1="48" x2="712" y1="242" y2="242" stroke="#e4e2dc"></line></g><g><rect x="40" y="248" width="680" height="28" rx="6" fill="#2a73d9" fill-opacity="0.08" stroke="#2a73d9"></rect><text x="48" y="266" font-size="13" font-weight="600" fill="#1f1f1f">▸ 전략 A (자리 표시)</text><text x="220" y="266" fill="#1f1f1f">모의 운용</text><text x="340" y="266" font-size="11.5" fill="#1f1f1f">모의 · 주식</text><text x="440" y="266" font-size="11.5" fill="#2a73d9">장부 비교 ▸</text><rect x="600" y="250" width="112" height="24" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="656" y="266" text-anchor="middle" fill="#1f1f1f">정지</text></g><g><text x="48" y="298" font-size="13" fill="#1f1f1f">전략 B (자리 표시)</text><text x="220" y="298" fill="#1f1f1f">백테스트 완료</text><text x="340" y="298" font-size="11.5" fill="#6b6b6b">—</text><text x="440" y="298" font-size="11.5" fill="#2a73d9">백테스트 결과 ▸</text><rect x="600" y="282" width="112" height="24" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="656" y="298" text-anchor="middle" fill="#1f1f1f">모의 운용 시작</text></g><g><text x="48" y="330" font-size="13" fill="#1f1f1f">전략 C (자리 표시)</text><text x="220" y="330" fill="#1f1f1f">초안</text><text x="340" y="330" font-size="11.5" fill="#6b6b6b">—</text><text x="440" y="330" font-size="11.5" fill="#6b6b6b">백테스트 결과 없음</text><text x="600" y="330" font-size="11.5" fill="#6b6b6b">백테스트 먼저</text></g><g><text x="48" y="362" font-size="13" fill="#1f1f1f">전략 D (자리 표시)</text><text x="220" y="362" fill="#1f1f1f">멈춤</text><text x="340" y="362" font-size="11.5" fill="#1f1f1f">모의 · 주식</text><text x="440" y="362" font-size="11.5" fill="#2a73d9">장부 비교 ▸</text><rect x="600" y="346" width="112" height="24" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="656" y="362" text-anchor="middle" fill="#1f1f1f">다시 시작</text></g><text x="48" y="388" font-size="11.5" fill="#6b6b6b">상태: 초안 → 백테스트 완료 → 모의 운용 ⇄ 멈춤 → 실전 운용 (M7 전 비활성)</text><text x="48" y="406" font-size="11.5" fill="#6b6b6b">모의 계좌는 하나: 모의 운용 전략이 둘일 때의 규칙 (미확인)</text><g><rect x="32" y="432" width="424" height="512" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="48" y="458" font-size="13" font-weight="600" fill="#1f1f1f">전략 A · 파라미터 (전략별 값)</text><text x="440" y="458" text-anchor="end" font-size="11.5" fill="#6b6b6b">지금 값 · 17장 초기값(가정값)</text><text x="48" y="488" font-size="11.5" fill="#1f1f1f">매수 기준 (jev 확률)</text><rect x="296" y="470" width="144" height="28" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="308" y="488" font-size="11.5" fill="#1f1f1f">0.70</text><text x="48" y="520" font-size="11.5" fill="#1f1f1f">매도 기준 (jev 확률)</text><rect x="296" y="502" width="144" height="28" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="308" y="520" font-size="11.5" fill="#1f1f1f">0.60</text><text x="48" y="552" font-size="11.5" fill="#1f1f1f">계획당 위험 r (총자산 %)</text><rect x="296" y="534" width="144" height="28" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="308" y="552" font-size="11.5" fill="#1f1f1f">0.5</text><text x="48" y="584" font-size="11.5" fill="#1f1f1f">손절 폭 k (ATR 배수)</text><rect x="296" y="566" width="144" height="28" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="308" y="584" font-size="11.5" fill="#1f1f1f">2</text><text x="48" y="616" font-size="11.5" fill="#1f1f1f">목표 주가 m (ATR 배수)</text><rect x="296" y="598" width="144" height="28" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="308" y="616" font-size="11.5" fill="#1f1f1f">4</text><text x="48" y="648" font-size="11.5" fill="#1f1f1f">회차 방식 (시간 분할 · 물타기 · 불타기)</text><rect x="296" y="630" width="144" height="28" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="308" y="648" font-size="11.5" fill="#6b6b6b">방식 고르기 ▾</text><text x="48" y="680" font-size="11.5" fill="#1f1f1f">분할 회차 / 계획 만료 (거래일)</text><rect x="296" y="662" width="144" height="28" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="308" y="680" font-size="11.5" fill="#1f1f1f">3 / 5</text><text x="48" y="712" font-size="11.5" fill="#1f1f1f">최소 보유 / 쿨다운 / 시간 청산 (거래일)</text><rect x="296" y="694" width="144" height="28" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="308" y="712" font-size="11.5" fill="#1f1f1f">1 / 5 / 20</text><text x="48" y="744" font-size="11.5" fill="#1f1f1f">하루 신규 계획 수</text><rect x="296" y="726" width="144" height="28" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="308" y="744" font-size="11.5" fill="#1f1f1f">3</text><text x="48" y="776" font-size="11.5" fill="#1f1f1f">교체 매매 (켬·끔 · 허들 · 하루 건수)</text><rect x="296" y="758" width="144" height="28" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="308" y="776" font-size="11.5" fill="#1f1f1f">켬 · 0.15 · 1건</text><line x1="48" x2="440" y1="796" y2="796" stroke="#e4e2dc"></line><text x="48" y="816" font-size="11.5" fill="#6b6b6b">저장하면 변경 이력에 새 줄(valid_from)이 쌓인다</text><text x="48" y="834" font-size="11.5" fill="#6b6b6b">검사: 확률은 0~1, 매수·매도 기준은 서로 달라야 한다 (6.2)</text><text x="48" y="858" font-size="11.5" fill="#2a73d9">계좌 단위 한도는 리스크 설정에서 고친다 ▸</text><text x="48" y="876" font-size="11.5" fill="#6b6b6b">(하루 신규 위험, 총 노출, 종목당 비중, 주문당 금액)</text><text x="48" y="906" font-size="11.5" font-weight="600" fill="#1f1f1f">다음 거래일 07:00부터 적용</text><rect x="296" y="888" width="144" height="28" rx="6" fill="#2a73d9" fill-opacity="0.12" stroke="#2a73d9" stroke-width="2"></rect><text x="368" y="907" text-anchor="middle" font-weight="600" fill="#1f1f1f">변경 저장</text><text x="48" y="932" font-size="11.5" fill="#6b6b6b">누르면 확인 대화상자 · 바뀐 칸이 없으면 꺼짐</text></g><g><rect x="472" y="432" width="256" height="512" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="488" y="458" font-size="13" font-weight="600" fill="#1f1f1f">상태 전환 · 전략 A</text><text x="488" y="482" font-size="11.5" fill="#1f1f1f">지금: 모의 운용</text><text x="488" y="500" font-size="11.5" fill="#6b6b6b">코드 PAPER_RUNNING</text><rect x="488" y="516" width="224" height="28" rx="6" fill="none" stroke="#e4e2dc" stroke-dasharray="4 3"></rect><text x="600" y="534" text-anchor="middle" fill="#6b6b6b">모의 운용 시작</text><text x="488" y="560" font-size="11.5" fill="#1f1f1f">백테스트 완료 → 모의 운용</text><text x="488" y="578" font-size="11.5" fill="#6b6b6b">모의 계좌에 주문이 나가기 시작</text><rect x="488" y="596" width="224" height="28" rx="6" fill="#f2a516" fill-opacity="0.12" stroke="#f2a516" stroke-width="2"></rect><text x="600" y="614" text-anchor="middle" font-weight="600" fill="#1f1f1f">정지</text><text x="488" y="640" font-size="11.5" fill="#1f1f1f">모의 운용 → 멈춤</text><text x="488" y="658" font-size="11.5" fill="#6b6b6b">새 주문만 막고 낸 주문·보유는 그대로</text><rect x="488" y="676" width="224" height="28" rx="6" fill="none" stroke="#e4e2dc" stroke-dasharray="4 3"></rect><text x="600" y="694" text-anchor="middle" fill="#6b6b6b">다시 시작</text><text x="488" y="720" font-size="11.5" fill="#1f1f1f">멈춤 → 멈추기 전 운용 상태</text><text x="488" y="738" font-size="11.5" fill="#6b6b6b">멈춤일 때만 켜진다</text><rect x="488" y="756" width="224" height="28" rx="6" fill="none" stroke="#e4e2dc" stroke-dasharray="4 3"></rect><text x="600" y="774" text-anchor="middle" fill="#6b6b6b">실전 전환 (실전 운용)</text><text x="488" y="800" font-size="11.5" fill="#1f1f1f">M7 전 비활성 (결정 2026-10-16)</text><text x="488" y="818" font-size="11.5" fill="#2a73d9">점검표는 실전 전환 화면 ▸ (16.3)</text><line x1="488" x2="712" y1="834" y2="834" stroke="#e4e2dc"></line><text x="488" y="856" font-size="11.5" fill="#1f1f1f">모든 전환은 확인 대화상자를 거친다</text><text x="488" y="874" font-size="11.5" fill="#6b6b6b">무엇이 시작·멈추는지 요약에 보인다</text></g><g><rect x="32" y="960" width="696" height="148" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="48" y="984" font-size="13" font-weight="600" fill="#1f1f1f">변경 이력</text><text x="712" y="984" text-anchor="end" font-size="11.5" fill="#6b6b6b">행을 누르면 그때 값 전체가 나온다</text><text x="48" y="1010" font-size="11.5" fill="#6b6b6b">valid_from (적용 시각)</text><text x="248" y="1010" font-size="11.5" fill="#6b6b6b">바뀐 파라미터 (전 → 후)</text><text x="520" y="1010" font-size="11.5" fill="#6b6b6b">바꾼 이유</text><line x1="48" x2="712" y1="1018" y2="1018" stroke="#e4e2dc"></line><rect x="40" y="1024" width="680" height="24" rx="6" fill="#2a73d9" fill-opacity="0.08"></rect><text x="48" y="1040" font-size="11.5" fill="#1f1f1f">YYYY-MM-DD 07:00</text><text x="168" y="1040" font-size="11.5" font-weight="600" fill="#1f1f1f">현재</text><text x="248" y="1040" font-size="11.5" fill="#1f1f1f">바뀐 항목: — → —</text><text x="520" y="1040" font-size="11.5" fill="#6b6b6b">—</text><text x="48" y="1066" font-size="11.5" fill="#1f1f1f">YYYY-MM-DD 07:00</text><text x="248" y="1066" font-size="11.5" fill="#1f1f1f">바뀐 항목: — → —</text><text x="520" y="1066" font-size="11.5" fill="#6b6b6b">—</text><text x="48" y="1092" font-size="11.5" fill="#1f1f1f">YYYY-MM-DD 07:00</text><text x="248" y="1092" font-size="11.5" fill="#1f1f1f">처음 값</text><text x="520" y="1092" font-size="11.5" fill="#6b6b6b">—</text></g></svg>
