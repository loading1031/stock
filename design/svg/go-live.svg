<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 760 792" role="img" aria-label="M7 전에는 실행이 꺼져 있고, 점검표와 실전 한도가 갖춰져야 확인 뒤 실행한다" font-size="12"><defs><marker id="live-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b9b6ad"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1f1f">M7 전에는 실행이 꺼져 있고, 점검표와 실전 한도가 갖춰져야 확인 뒤 실행한다</text><text x="24" y="50" font-size="11.5" fill="#6b6b6b">와이어프레임 · 모의 주식 계좌에서 연 모습 · 값은 자리 표시</text><g><rect x="16" y="64" width="728" height="704" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect></g><g><rect x="16" y="64" width="728" height="40" rx="8" fill="#ededeb" stroke="#e4e2dc"></rect><text x="380" y="89" text-anchor="middle" fill="#6b6b6b">자동 주문 표시줄 · 변형 1 (켜짐) · 전환 뒤 실전 계좌 화면은 변형 6</text></g><g><text x="32" y="136" font-size="15" font-weight="600" fill="#1f1f1f">실전 전환</text><rect x="112" y="121" width="84" height="22" rx="11" fill="#f2a516" fill-opacity="0.12" stroke="#f2a516"></rect><text x="154" y="136" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f1f1f">ADMIN 전용</text><text x="32" y="154" font-size="11.5" fill="#6b6b6b">관리 › 실전 전환 · 권한 헤더로 확인한다</text><text x="728" y="136" text-anchor="end" font-size="11.5" fill="#2a73d9">장부 비교·평가 ▸  계좌 연결 ▸</text><text x="728" y="154" text-anchor="end" font-size="11.5" fill="#6b6b6b">업무 흐름 5 · 실전 전환</text></g><g><rect x="32" y="170" width="696" height="30" rx="6" fill="#ededeb" stroke="#e4e2dc"></rect><text x="48" y="190" font-size="11.5" font-weight="600" fill="#1f1f1f">M7 전 · 실전 전환 실행은 비활성 (결정 2026-10-16)</text></g><g><rect x="32" y="216" width="696" height="340" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="48" y="240" font-size="13" font-weight="600" fill="#1f1f1f">실전 전환 기준 점검표 (strategy.md 16.3)</text><text x="712" y="240" text-anchor="end" font-size="11.5" fill="#6b6b6b">전부 충족해야 실행</text><text x="48" y="266" font-size="11.5" fill="#6b6b6b">기준</text><text x="392" y="266" font-size="11.5" fill="#6b6b6b">값</text><text x="572" y="266" font-size="11.5" fill="#6b6b6b">상태</text><line x1="48" x2="712" y1="274" y2="274" stroke="#e4e2dc"></line><text x="48" y="298" font-size="13" fill="#1f1f1f"><tspan x="48" y="298">운영 장부가 단순 규칙 장부를 3개월 이상</tspan><tspan x="48" y="316">비용 차감 후 수익률과 MDD 모두에서 앞섬</tspan></text><text x="48" y="334" font-size="11.5" fill="#2a73d9">장부 비교·평가 ▸</text><text x="392" y="298" font-size="11.5" fill="#6b6b6b">비교 기간 —개월</text><text x="392" y="316" font-size="11.5" fill="#6b6b6b">수익률·MDD 차 —</text><rect x="572" y="292" width="140" height="22" rx="11" fill="none" stroke="#b9b6ad"></rect><text x="642" y="307" text-anchor="middle" font-size="11.5" fill="#6b6b6b">충족 · 미충족 · 확인 필요</text><line x1="48" x2="712" y1="348" y2="348" stroke="#e4e2dc"></line><text x="48" y="372" font-size="13" fill="#1f1f1f">보수적 체결 모델의 백테스트에서도 수익이 남음</text><text x="48" y="390" font-size="11.5" fill="#2a73d9">백테스트 결과 ▸</text><text x="392" y="372" font-size="11.5" fill="#6b6b6b">보수적 체결 수익률 —</text><rect x="572" y="357" width="140" height="22" rx="11" fill="none" stroke="#b9b6ad"></rect><text x="642" y="372" text-anchor="middle" font-size="11.5" fill="#6b6b6b">충족 · 미충족 · 확인 필요</text><line x1="48" x2="712" y1="404" y2="404" stroke="#e4e2dc"></line><text x="48" y="428" font-size="13" fill="#1f1f1f"><tspan x="48" y="428">강제 청산, 자동 주문 끄기, 대사가 모의에서</tspan><tspan x="48" y="446">실제로 한 번 이상 동작한 기록이 있음</tspan></text><text x="48" y="464" font-size="11.5" fill="#2a73d9">대사 결과 ▸ 등 기록</text><text x="392" y="428" font-size="11.5" fill="#6b6b6b">강제 청산 —</text><text x="392" y="446" font-size="11.5" fill="#6b6b6b">자동 주문 끄기 —</text><text x="392" y="464" font-size="11.5" fill="#6b6b6b">대사 — (마지막 동작)</text><rect x="572" y="431" width="140" height="22" rx="11" fill="none" stroke="#b9b6ad"></rect><text x="642" y="446" text-anchor="middle" font-size="11.5" fill="#6b6b6b">충족 · 미충족 · 확인 필요</text><line x1="48" x2="712" y1="478" y2="478" stroke="#e4e2dc"></line><text x="48" y="502" font-size="13" fill="#1f1f1f">실전 계좌의 리스크 한도를 저장함</text><text x="48" y="520" font-size="11.5" fill="#6b6b6b">plan.md 7장 M7 소액 운용 · 저장 전에는 실행 불가</text><text x="392" y="502" font-size="11.5" fill="#6b6b6b">주문당 — · 일일 손실 —</text><rect x="572" y="487" width="140" height="22" rx="11" fill="none" stroke="#b9b6ad"></rect><text x="642" y="502" text-anchor="middle" font-size="11.5" fill="#6b6b6b">저장함 · 없음</text><text x="48" y="544" font-size="11.5" fill="#6b6b6b">리셋으로 구간이 끊기면 3개월을 새로 세는지 미정 (strategy.md 15장)</text></g><g><rect x="32" y="572" width="696" height="180" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="48" y="596" font-size="13" font-weight="600" fill="#1f1f1f">전환 흐름 · 계좌 환경은 레코드에서 바꿀 수 없다</text><g fill="none" stroke="#b9b6ad" stroke-width="1.25"><path d="M256 644H278" marker-end="url(#live-arrow)"></path><path d="M488 644H510" marker-end="url(#live-arrow)"></path></g><g><rect x="48" y="608" width="208" height="72" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="152" y="630" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1f">실전 계좌 새로 등록</text><text x="152" y="650" text-anchor="middle" font-size="11.5" fill="#6b6b6b">앱키는 계좌마다 따로 받는다</text><text x="152" y="668" text-anchor="middle" font-size="11.5" fill="#2a73d9">계좌 연결 (실전 고름) ▸</text></g><g><rect x="280" y="608" width="208" height="72" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="384" y="630" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1f">전략을 실전 계좌에 연결</text><text x="384" y="650" text-anchor="middle" font-size="11.5" fill="#6b6b6b">모의 계좌는 그대로 (가정)</text><text x="384" y="668" text-anchor="middle" font-size="11.5" fill="#6b6b6b">자동 주문 꺼진 채 시작</text></g><g><rect x="512" y="608" width="200" height="72" rx="8" fill="none" stroke="#e4e2dc" stroke-width="1.25" stroke-dasharray="4 4"></rect><text x="612" y="630" text-anchor="middle" font-size="13" font-weight="600" fill="#6b6b6b">실전 전환 실행 (비활성)</text><text x="612" y="650" text-anchor="middle" font-size="11.5" fill="#6b6b6b">M7 전 · 점검표 미충족</text><text x="612" y="668" text-anchor="middle" font-size="11.5" fill="#6b6b6b">누르면 확인 대화상자(위험)</text></g><text x="48" y="704" font-size="11.5" fill="#6b6b6b">실행 때 점검표를 다시 계산한다. 자동 주문 꺼짐·리셋 판정 중 실행을 막을지는 미정</text><text x="48" y="722" font-size="11.5" fill="#6b6b6b">실전의 증거금·당일 재매수 규칙은 B-11에서 확인 (미확인)</text><text x="48" y="740" font-size="11.5" fill="#6b6b6b">전환 뒤 실전 계좌 화면의 표시줄은 변형 6 (계좌 칸 위험색)</text></g></svg>
