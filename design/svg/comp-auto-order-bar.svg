<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 760 824" role="img" aria-label="표시줄은 꺼진 이유와 신규 매수 건너뜀을 구분해 보인다" font-size="12"><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1f1f">표시줄은 꺼진 이유와 ‘신규 매수만 건너뜀’을 구분해 보인다</text><text x="24" y="50" font-size="11.5" fill="#6b6b6b">컴포넌트 · 자동 주문 표시줄 · 변형 8가지</text><g><text x="24" y="76" font-weight="600" fill="#1f1f1f">1 · 켜짐 (M4부터 기본)</text><rect x="24" y="84" width="712" height="40" rx="8" fill="#ededeb" stroke="#b9b6ad" stroke-width="1"></rect><g><rect x="112" y="94" width="40" height="20" rx="10" fill="#1a9e2a" fill-opacity="0.3" stroke="#1a9e2a"></rect><circle cx="142" cy="104" r="7" fill="#1a9e2a"></circle></g><circle cx="560" cy="104" r="5" fill="#1a9e2a"></circle><text x="40" y="109" font-weight="600" fill="#1f1f1f">자동 주문</text><text x="160" y="109" fill="#1f1f1f">켜짐</text><text x="400" y="109" text-anchor="middle" font-size="11.5" fill="#6b6b6b">계좌: 모의 · 주식</text><text x="572" y="109" font-size="11.5" fill="#1f1f1f">실시간 연결됨</text></g><g><text x="24" y="152" font-weight="600" fill="#1f1f1f">2 · 꺼짐 · 사람이 끔</text><rect x="24" y="160" width="712" height="40" rx="8" fill="#ededeb" stroke="#d23a3a" stroke-width="2"></rect><g><rect x="112" y="170" width="40" height="20" rx="10" fill="none" stroke="#b9b6ad"></rect><circle cx="122" cy="180" r="7" fill="#6b6b6b"></circle></g><circle cx="560" cy="180" r="5" fill="#1a9e2a"></circle><text x="40" y="185" font-weight="600" fill="#1f1f1f">자동 주문</text><text x="160" y="185" font-weight="600" fill="#1f1f1f">꺼짐 · hh:mm에 끔</text><text x="400" y="185" text-anchor="middle" font-size="11.5" fill="#6b6b6b">계좌: 모의 · 주식</text><text x="572" y="185" font-size="11.5" fill="#1f1f1f">실시간 연결됨</text><rect x="24" y="204" width="712" height="28" rx="6" fill="#d23a3a" fill-opacity="0.12" stroke="#d23a3a"></rect><text x="40" y="223" fill="#1f1f1f">강제 청산도 멈춤 — 손절 보호 없음. 낸 주문과 보유는 그대로</text><text x="720" y="223" text-anchor="end" fill="#2a73d9">미체결 주문 취소 ▸</text></g><g><text x="24" y="260" font-weight="600" fill="#1f1f1f">3 · 꺼짐 · 리셋 판정 (저절로 꺼짐)</text><rect x="24" y="268" width="712" height="40" rx="8" fill="#ededeb" stroke="#d23a3a" stroke-width="2"></rect><g><rect x="112" y="278" width="40" height="20" rx="10" fill="none" stroke="#b9b6ad"></rect><circle cx="122" cy="288" r="7" fill="#6b6b6b"></circle></g><circle cx="560" cy="288" r="5" fill="#1a9e2a"></circle><text x="40" y="293" font-weight="600" fill="#1f1f1f">자동 주문</text><text x="160" y="293" font-weight="600" fill="#1f1f1f">꺼짐 · 리셋 판정</text><text x="400" y="293" text-anchor="middle" font-size="11.5" fill="#6b6b6b">계좌: 모의 · 주식</text><text x="572" y="293" font-size="11.5" fill="#1f1f1f">실시간 연결됨</text><rect x="24" y="312" width="712" height="28" rx="6" fill="#d23a3a" fill-opacity="0.12" stroke="#d23a3a"></rect><text x="40" y="331" fill="#1f1f1f">계좌 리셋 판정 — 강제 청산도 멈춤. 확인한 뒤 다시 켠다</text><text x="720" y="331" text-anchor="end" fill="#2a73d9">대사 결과 ▸</text></g><g><text x="24" y="368" font-weight="600" fill="#1f1f1f">4 · 켜짐 · 오늘 신규 매수 건너뜀</text><rect x="24" y="376" width="712" height="40" rx="8" fill="#ededeb" stroke="#b9b6ad" stroke-width="1"></rect><g><rect x="112" y="386" width="40" height="20" rx="10" fill="#1a9e2a" fill-opacity="0.3" stroke="#1a9e2a"></rect><circle cx="142" cy="396" r="7" fill="#1a9e2a"></circle></g><circle cx="560" cy="396" r="5" fill="#1a9e2a"></circle><text x="40" y="401" font-weight="600" fill="#1f1f1f">자동 주문</text><text x="160" y="401" fill="#1f1f1f">켜짐</text><text x="400" y="401" text-anchor="middle" font-size="11.5" fill="#6b6b6b">계좌: 모의 · 주식</text><text x="572" y="401" font-size="11.5" fill="#1f1f1f">실시간 연결됨</text><rect x="24" y="420" width="712" height="28" rx="6" fill="#f2a516" fill-opacity="0.12" stroke="#f2a516"></rect><text x="40" y="439" fill="#1f1f1f">오늘 신규 매수 건너뜀 · Ollama 장애·대사 불일치·일일 손실 한도·데이터 수집 실패. 강제 청산은 계속</text><text x="720" y="439" text-anchor="end" fill="#2a73d9">자세히 ▸</text></g><g><text x="24" y="476" font-weight="600" fill="#1f1f1f">5 · 실시간 끊김 (값 옆에 받은 시각을 함께 보인다)</text><rect x="24" y="484" width="712" height="40" rx="8" fill="#ededeb" stroke="#b9b6ad" stroke-width="1"></rect><g><rect x="112" y="494" width="40" height="20" rx="10" fill="#1a9e2a" fill-opacity="0.3" stroke="#1a9e2a"></rect><circle cx="142" cy="504" r="7" fill="#1a9e2a"></circle></g><circle cx="560" cy="504" r="5" fill="#f2a516"></circle><text x="40" y="509" font-weight="600" fill="#1f1f1f">자동 주문</text><text x="160" y="509" fill="#1f1f1f">켜짐</text><text x="400" y="509" text-anchor="middle" font-size="11.5" fill="#6b6b6b">계좌: 모의 · 주식</text><text x="572" y="509" font-size="11.5" fill="#1f1f1f">실시간 끊김 · 재연결 중</text></g><g><text x="24" y="552" font-weight="600" fill="#1f1f1f">6 · 실전 계좌 화면 (M7부터)</text><rect x="24" y="560" width="712" height="40" rx="8" fill="#ededeb" stroke="#b9b6ad" stroke-width="1"></rect><g><rect x="112" y="570" width="40" height="20" rx="10" fill="#1a9e2a" fill-opacity="0.3" stroke="#1a9e2a"></rect><circle cx="142" cy="580" r="7" fill="#1a9e2a"></circle></g><circle cx="560" cy="580" r="5" fill="#1a9e2a"></circle><text x="40" y="585" font-weight="600" fill="#1f1f1f">자동 주문</text><text x="160" y="585" fill="#1f1f1f">켜짐</text><rect x="328" y="568" width="144" height="24" rx="12" fill="#d23a3a" fill-opacity="0.12" stroke="#d23a3a" stroke-width="2"></rect><text x="400" y="585" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f1f1f">계좌: 실전 · 주식</text><text x="572" y="585" font-size="11.5" fill="#1f1f1f">실시간 연결됨</text></g><g><text x="24" y="628" font-weight="600" fill="#1f1f1f">7 · M1~M3 (자동 주문 전)</text><rect x="24" y="636" width="712" height="40" rx="8" fill="#ededeb" stroke="#b9b6ad" stroke-width="1"></rect><text x="40" y="661" font-weight="600" fill="#6b6b6b">자동 주문</text><text x="112" y="661" fill="#6b6b6b">M4부터</text><text x="400" y="661" text-anchor="middle" font-size="11.5" fill="#6b6b6b">계좌: 모의 · 주식</text><text x="572" y="661" font-size="11.5" fill="#6b6b6b">시세: 조회만 (M1)</text></g><g><text x="24" y="704" font-weight="600" fill="#1f1f1f">8 · 증권사 연결 실패 (토큰 발급 실패)</text><rect x="24" y="712" width="712" height="40" rx="8" fill="#ededeb" stroke="#d23a3a" stroke-width="2"></rect><g><rect x="112" y="722" width="40" height="20" rx="10" fill="#1a9e2a" fill-opacity="0.3" stroke="#1a9e2a"></rect><circle cx="142" cy="732" r="7" fill="#1a9e2a"></circle></g><circle cx="560" cy="732" r="5" fill="#d23a3a"></circle><text x="40" y="737" font-weight="600" fill="#1f1f1f">자동 주문</text><text x="160" y="737" font-weight="600" fill="#1f1f1f">켜짐 · 주문 불가</text><text x="400" y="737" text-anchor="middle" font-size="11.5" fill="#6b6b6b">계좌: 모의 · 주식</text><text x="572" y="737" font-size="11.5" fill="#1f1f1f">증권사 연결 실패</text><rect x="24" y="756" width="712" height="28" rx="6" fill="#d23a3a" fill-opacity="0.12" stroke="#d23a3a"></rect><text x="40" y="775" fill="#1f1f1f">토큰 발급 실패 — 주문과 강제 청산이 모두 나가지 않는다. 1분 뒤 다시 발급 (제안)</text><text x="720" y="775" text-anchor="end" fill="#2a73d9">계좌 연결 ▸</text></g><text x="24" y="808" font-size="11.5" fill="#6b6b6b">꺼짐은 테두리를 위험색으로 바꾸고 이유를 붙인다. 신규 매수만 건너뛸 때는 토글이 켜짐 그대로다(결정 2026-10-16)</text></svg>
