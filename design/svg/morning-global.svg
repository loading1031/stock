<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 760 886" role="img" aria-label="아침 7시에 간밤 미국 일봉과 야간선물 갭을 보고, 값마다 기준 시점과 받은 시각을 확인한다" font-size="12"><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1f1f">아침 7시에 간밤 미국 일봉과 야간선물 갭을 보고, 값마다 기준 시점을 확인한다</text><text x="24" y="50" font-size="11.5" fill="#6b6b6b">와이어프레임 초안 · 모의 주식 계좌 · 값은 B-02 실측 예시 또는 자리 표시(—)</text><g><rect x="16" y="64" width="728" height="798" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect></g><g><rect x="16" y="64" width="728" height="40" rx="8" fill="#ededeb" stroke="#b9b6ad"></rect><text x="32" y="89" font-size="13" fill="#1f1f1f">자동 주문 표시줄 · 변형 7 (M1~M3)</text><text x="728" y="89" text-anchor="end" font-size="11.5" fill="#6b6b6b">연결 칸은 이 화면 값(배치)과 무관</text></g><g><text x="32" y="134" font-size="15" font-weight="600" fill="#1f1f1f">아침 해외 지표</text><text x="32" y="152" font-size="11.5" fill="#6b6b6b">시장 › 아침 해외 지표</text><text x="728" y="134" text-anchor="end" font-size="11.5" fill="#2a73d9">아침 리포트 ▸</text><text x="728" y="152" text-anchor="end" font-size="11.5" fill="#6b6b6b">업무 흐름 1 · 리포트 화면은 M5부터</text></g><g><rect x="32" y="168" width="696" height="460" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="48" y="192" font-size="13" font-weight="600" fill="#1f1f1f">간밤 미국 장 마감 일봉 (2026-10-14, 미국 날짜)</text><text x="712" y="192" text-anchor="end" font-size="11.5" fill="#6b6b6b">07:00 배치 기준 · 2026-10-15</text></g><g><text x="48" y="222" font-size="11.5" fill="#6b6b6b">지표</text><text x="228" y="222" font-size="11.5" fill="#6b6b6b">단위</text><text x="352" y="222" text-anchor="end" font-size="11.5" fill="#6b6b6b">종가</text><text x="440" y="222" text-anchor="end" font-size="11.5" fill="#6b6b6b">등락 % (계산)</text><text x="456" y="222" font-size="11.5" fill="#6b6b6b">기준 시점</text><text x="568" y="222" font-size="11.5" fill="#6b6b6b">받은 시각 (available_at)</text><line x1="48" x2="712" y1="230" y2="230" stroke="#e4e2dc"></line></g><g><text x="48" y="252" font-size="13" fill="#1f1f1f">S&amp;P 500</text><text x="228" y="252" font-size="13" fill="#6b6b6b">pt</text><text x="352" y="252" text-anchor="end" font-size="13" fill="#6b6b6b">—</text><text x="440" y="252" text-anchor="end" font-size="13" fill="#6b6b6b">—</text><text x="456" y="252" font-size="13" fill="#6b6b6b">일봉 종가</text><text x="568" y="252" font-size="13" fill="#6b6b6b">—</text></g><g><text x="48" y="280" font-size="13" fill="#1f1f1f">SOX (필라델피아 반도체)</text><text x="228" y="280" font-size="13" fill="#6b6b6b">pt</text><text x="352" y="280" text-anchor="end" font-size="13" fill="#6b6b6b">—</text><text x="440" y="280" text-anchor="end" font-size="13" fill="#6b6b6b">—</text><text x="456" y="280" font-size="13" fill="#6b6b6b">일봉 종가</text><text x="568" y="280" font-size="13" fill="#6b6b6b">—</text></g><g><text x="48" y="308" font-size="13" fill="#1f1f1f">VIX</text><text x="228" y="308" font-size="13" fill="#6b6b6b">pt</text><text x="352" y="308" text-anchor="end" font-size="13" fill="#1f1f1f">16.87</text><text x="440" y="308" text-anchor="end" font-size="13" fill="#6b6b6b">—</text><text x="456" y="308" font-size="13" fill="#6b6b6b">10/14 일봉 종가</text><text x="568" y="308" font-size="13" fill="#6b6b6b">—</text></g><g><text x="48" y="336" font-size="13" fill="#1f1f1f">원/달러</text><text x="228" y="336" font-size="13" fill="#6b6b6b">원</text><text x="352" y="336" text-anchor="end" font-size="13" fill="#1f1f1f">1342.30</text><text x="440" y="336" text-anchor="end" font-size="13" fill="#6b6b6b">—</text><text x="456" y="336" font-size="13" fill="#6b6b6b">일봉 종가</text><text x="568" y="336" font-size="13" fill="#6b6b6b">—</text><text x="64" y="354" font-size="11.5" fill="#6b6b6b">현재가상세의 당일환율 t_rate는 1350.90 (10/15 12:10 조회) · 일봉 1342.30과 기준이 다르다</text></g><g><text x="48" y="382" font-size="13" fill="#1f1f1f">미국 10년 국채 수익률</text><text x="228" y="382" font-size="13" fill="#6b6b6b">%</text><text x="352" y="382" text-anchor="end" font-size="13" fill="#1f1f1f">5.19</text><text x="440" y="382" text-anchor="end" font-size="13" fill="#6b6b6b">—</text><text x="456" y="382" font-size="13" fill="#6b6b6b">일봉 종가</text><text x="568" y="382" font-size="13" fill="#6b6b6b">—</text></g><g><line x1="48" x2="712" y1="394" y2="394" stroke="#e4e2dc"></line><text x="48" y="416" font-size="13" fill="#1f1f1f">NVDA</text><text x="228" y="416" font-size="13" fill="#6b6b6b">USD</text><text x="352" y="416" text-anchor="end" font-size="13" fill="#6b6b6b">—</text><text x="440" y="416" text-anchor="end" font-size="13" fill="#6b6b6b">—</text><text x="456" y="416" font-size="13" fill="#6b6b6b">일봉 종가</text><text x="568" y="416" font-size="13" fill="#6b6b6b">—</text><text x="48" y="444" font-size="13" fill="#1f1f1f">MU</text><text x="228" y="444" font-size="13" fill="#6b6b6b">USD</text><text x="352" y="444" text-anchor="end" font-size="13" fill="#6b6b6b">—</text><text x="440" y="444" text-anchor="end" font-size="13" fill="#6b6b6b">—</text><text x="456" y="444" font-size="13" fill="#6b6b6b">일봉 종가</text><text x="568" y="444" font-size="13" fill="#6b6b6b">—</text><text x="48" y="472" font-size="13" fill="#1f1f1f">EWY (MSCI Korea ETF)</text><text x="228" y="472" font-size="13" fill="#6b6b6b">USD</text><text x="352" y="472" text-anchor="end" font-size="13" fill="#6b6b6b">—</text><text x="440" y="472" text-anchor="end" font-size="13" fill="#6b6b6b">—</text><text x="456" y="472" font-size="13" fill="#6b6b6b">일봉 종가</text><text x="568" y="472" font-size="13" fill="#6b6b6b">—</text><text x="64" y="490" font-size="11.5" fill="#6b6b6b">해외주식 일봉 TR은 미확인 · SOX 구성 종목은 따로 묶는다(plan.md 3.11)</text></g><g><line x1="48" x2="712" y1="502" y2="502" stroke="#e4e2dc"></line><text x="48" y="524" font-size="11.5" fill="#1f1f1f">참고 · 현재가상세(10/15 12:10 조회): 원환산 t_xprc 463,305원, 당일환율 t_rate 1350.90</text><text x="48" y="542" font-size="11.5" fill="#6b6b6b">일봉 종가가 아니고 환율 기준도 달라 표에 넣지 않는다. 어느 종목 값인지는 B-02에 없다(AAPL·NVDA 조회)</text></g><g><line x1="48" x2="712" y1="554" y2="554" stroke="#e4e2dc"></line><text x="48" y="576" font-size="13" fill="#1f1f1f">예: .DJI (잘못된 코드)</text><text x="352" y="576" text-anchor="end" font-size="13" fill="#f2a516">값 없음</text><text x="440" y="576" text-anchor="end" font-size="13" fill="#6b6b6b">—</text><text x="568" y="576" font-size="13" fill="#6b6b6b">—</text><text x="64" y="594" font-size="11.5" fill="#6b6b6b">KIS가 에러 없이 0을 주면 0이 아니라 값 없음으로 보인다</text><text x="64" y="612" font-size="11.5" fill="#6b6b6b">0 검사는 종가 같은 원 값에만 한다. 등락 0은 정상값이다</text></g><g><rect x="32" y="644" width="696" height="178" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="48" y="668" font-size="13" font-weight="600" fill="#1f1f1f">KOSPI200 야간선물 · A01612 (2026-12월물)</text><text x="712" y="668" text-anchor="end" font-size="11.5" fill="#f2a516">출처 미확인</text><text x="48" y="698" font-size="11.5" fill="#6b6b6b">야간 종가 (pt)</text><text x="200" y="698" font-size="11.5" fill="#6b6b6b">전일 정규장 종가 (pt)</text><text x="380" y="698" font-size="11.5" fill="#6b6b6b">갭 % (계산)</text><text x="568" y="698" font-size="11.5" fill="#6b6b6b">받은 시각</text><line x1="48" x2="712" y1="706" y2="706" stroke="#e4e2dc"></line><text x="48" y="728" font-size="13" fill="#6b6b6b">—</text><text x="200" y="728" font-size="13" fill="#6b6b6b">—</text><text x="380" y="728" font-size="13" fill="#6b6b6b">—</text><text x="568" y="728" font-size="13" fill="#6b6b6b">—</text><text x="48" y="752" font-size="11.5" fill="#6b6b6b">야간 시세는 WebSocket H0MFCNT0이고 야간(18:00 이후)에 확인 필요. 종가 REST 조회도 미확인</text><text x="48" y="770" font-size="11.5" fill="#6b6b6b">B-02의 865.20은 A01612의 주간 현재가다(야간 값 아님). 월물 목록은 선물 전광판 FHPIF05030200</text><text x="48" y="788" font-size="11.5" fill="#6b6b6b">KRX 공시 기준 18:00~다음날 06:00, 거래일은 끝나는 날 (미확인)</text><text x="48" y="806" font-size="11.5" fill="#6b6b6b">갭 = 야간 종가 ÷ 전일 정규장 종가 − 1 · 월물이 바뀌면 새 코드를 이 줄에 보인다</text></g><g><text x="32" y="846" font-size="11.5" fill="#6b6b6b">미국 지수 선물(ES·NQ)은 넣지 않는다 (유료라 제외)</text><text x="560" y="846" font-size="11.5" font-weight="600" fill="#d23a3a">▲ 상승 빨강</text><text x="644" y="846" font-size="11.5" font-weight="600" fill="#2a73d9">▼ 하락 파랑</text></g></svg>
