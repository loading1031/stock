<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 760 624" role="img" aria-label="로그인 뒤 대시보드로 들어가고 메뉴는 여섯 묶음, 자동 주문 표시줄은 늘 위에 있다" font-size="13"><defs><marker id="ia-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b9b6ad"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1f1f">로그인 뒤 대시보드로 들어가고, 메뉴는 여섯 묶음, 자동 주문 표시줄은 늘 위에 있다</text><text x="24" y="50" font-size="11.5" fill="#6b6b6b">제안 · 진입 흐름, 고정 표시줄, 메뉴 묶음과 화면 18개</text><g fill="none" stroke="#b9b6ad" stroke-width="1.25"><path d="M184 92H272" marker-end="url(#ia-arrow)"></path><path d="M488 92H552" marker-end="url(#ia-arrow)"></path></g><g><rect x="24" y="68" width="160" height="48" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="104" y="97" text-anchor="middle" font-weight="600" fill="#1f1f1f">로그인</text></g><g><rect x="272" y="68" width="216" height="48" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="380" y="89" text-anchor="middle" font-weight="600" fill="#1f1f1f">계좌 연결</text><text x="380" y="106" text-anchor="middle" font-size="11.5" fill="#6b6b6b">계좌가 없을 때 (첫 사용)</text></g><g><rect x="552" y="68" width="184" height="48" rx="8" fill="#2a73d9" fill-opacity="0.12" stroke="#2a73d9" stroke-width="2"></rect><text x="644" y="89" text-anchor="middle" font-weight="600" fill="#1f1f1f">대시보드</text><text x="644" y="106" text-anchor="middle" font-size="11.5" fill="#6b6b6b">첫 화면</text></g><text x="24" y="132" font-size="11.5" fill="#6b6b6b">계좌가 이미 있으면 로그인 뒤 바로 대시보드</text><g><rect x="24" y="144" width="712" height="32" rx="8" fill="#ededeb" stroke="#b9b6ad"></rect><text x="380" y="165" text-anchor="middle" fill="#1f1f1f">모든 화면 위에 고정: 자동 주문 표시줄 — 켜기·끄기, 이 화면의 계좌, 연결 상태</text></g><text x="24" y="200" font-size="11.5" fill="#6b6b6b">메뉴 · 여섯 묶음 (모든 화면 왼쪽)</text><g><rect x="24" y=