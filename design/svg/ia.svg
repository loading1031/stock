troke="#b9b6ad" stroke-width="1.25"></rect><text x="524" y="406" font-weight="600" fill="#1f1f1f">관리</text><text x="724" y="406" text-anchor="end" font-size="11.5" fill="#6b6b6b">설정과 점검</text><rect x="524" y="420" width="200" height="32" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="536" y="441" font-size="12.5" fill="#1f1f1f">계좌 연결</text><text x="712" y="441" text-anchor="end" font-size="11.5" fill="#6b6b6b">M1</text><rect x="524" y="460" width="200" height="32" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="536" y="481" font-size="12.5" fill="#1f1f1f">리스크 설정</text><text x="712" y="481" text-anchor="end" font-size="11.5" fill="#6b6b6b">M4</text><rect x="524" y="500" width="200" height="32" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="536" y="521" font-size="12.5" fill="#1f1f1f">대사 결과</text><text x="712" y="521" text-anchor="end" font-size="11.5" fill="#6b6b6b">M4</text><rect x="524" y="540" width="200" height="32" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="536" y="561" font-size="12.5" fill="#1f1f1f">실전 전환 · ADMIN</text><text x="712" y="561" text-anchor="end" font-size="11.5" fill="#6b6b6b">M7</text></g><text x="24" y="608" font-size="11.5" fill="#6b6b6b">대시보드는 M1에서 KIS 조회 그대로, M3에서 원장 기반으로 같은 자리를 바꾼다. 자동 주문 켜기·끄기는 별도 화면이 아니라 표시줄이다</text></svg>
