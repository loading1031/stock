<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 760 1230" role="img" aria-label="기준 비교는 운영(보수적 재계산) 행으로, 모든 값은 비용 차감 후로 본다" font-size="12"><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1f1f">기준 비교는 운영(보수적 재계산) 행으로, 모든 값은 비용 차감 후로 본다</text><text x="24" y="50" font-size="11.5" fill="#6b6b6b">와이어프레임 초안 · 모의 주식 계좌 · 값은 자리 표시(—)</text><g><rect x="16" y="64" width="728" height="1142" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect></g><g><rect x="16" y="64" width="728" height="40" rx="8" fill="#ededeb" stroke="#b9b6ad"></rect><text x="380" y="89" text-anchor="middle" fill="#6b6b6b">자동 주문 표시줄 · 변형 1 (켜짐)</text></g><g><text x="32" y="134" font-size="15" font-weight="600" fill="#1f1f1f">장부 비교·평가</text><text x="32" y="152" font-size="11.5" fill="#6b6b6b">성과 › 장부 비교·평가</text><text x="616" y="134" text-anchor="end" font-size="11.5" fill="#2a73d9">◂ 백테스트 결과</text><text x="712" y="134" text-anchor="end" font-size="11.5" fill="#2a73d9">실전 전환 ▸</text><text x="712" y="152" text-anchor="end" font-size="11.5" fill="#6b6b6b">업무 흐름 5 · 실전 전환은 M7부터</text></g><g><text x="32" y="186" font-size="11.5" fill="#6b6b6b">기간</text><rect x="64" y="168" width="56" height="28" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="92" y="186" text-anchor="middle" fill="#6b6b6b">1개월</text><rect x="120" y="168" width="56" height="28" rx="6" fill="#2a73d9" fill-opacity="0.12" stroke="#2a73d9"></rect><text x="148" y="186" text-anchor="middle" fill="#1f1f1f">3개월</text><rect x="176" y="168" width="72" height="28" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="212" y="186" text-anchor="middle" fill="#6b6b6b">구간 전체</text><text x="266" y="186" font-size="11.5" fill="#6b6b6b">성과 구간</text><rect x="332" y="168" width="152" height="28" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="344" y="186" fill="#1f1f1f">현재 구간 ▾</text><text x="500" y="186" font-size="11.5" fill="#6b6b6b">기간은 고른 구간 안으로 자른다(제안)</text></g><g><rect x="32" y="208" width="696" height="46" rx="6" fill="#f2a516" fill-opacity="0.12" stroke="#f2a516"></rect><text x="48" y="226" font-size="11.5" fill="#1f1f1f">모의 성과는 실전보다 좋게 나온다: 호가 대기열·시장 충격이 없다</text><text x="48" y="244" font-size="11.5" fill="#1f1f1f">운영은 실제 체결, 가상 장부는 보수적 체결 규칙이다. 판정과 효과는 운영(보수적 재계산)으로 계산한다</text></g><g><rect x="32" y="270" width="696" height="126" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="48" y="294" font-size="13" font-weight="600" fill="#1f1f1f">실전 전환 기준 (strategy.md 16.3)</text><text x="712" y="294" text-anchor="end" font-weight="600" fill="#1f1f1f">판정 — · 3개월 중 —개월째</text><text x="48" y="314" font-size="11.5" fill="#6b6b6b">운영(보수적 재계산)이 단순 규칙을 비용 차감 후 수익률과 MDD 모두에서 앞서야 한다</text><rect x="48" y="330" width="210" height="52" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="60" y="350" font-weight="600" fill="#1f1f1f">교체 효과</text><text x="60" y="370" font-size="11.5" fill="#6b6b6b">운영(재계산) − 교체 없음</text><text x="246" y="362" text-anchor="end" font-size="15" font-weight="600" fill="#1f1f1f">—</text><rect x="275" y="330" width="210" height="52" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="287" y="350" font-weight="600" fill="#1f1f1f">jev 매도 효과</text><text x="287" y="370" font-size="11.5" fill="#6b6b6b">교체 없음 − jev 매수만</text><text x="473" y="362" text-anchor="end" font-size="15" font-weight="600" fill="#1f1f1f">—</text><rect x="502" y="330" width="210" height="52" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="514" y="350" font-weight="600" fill="#1f1f1f">jev 매수 효과</text><text x="514" y="370" font-size="11.5" fill="#6b6b6b">jev 매수만 − 단순 규칙</text><text x="700" y="362" text-anchor="end" font-size="15" font-weight="600" fill="#1f1f1f">—</text></g><g><rect x="32" y="412" width="696" height="300" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><rect x="40" y="511" width="680" height="38" rx="4" fill="#ededeb"></rect><text x="48" y="436" font-size="13" font-weight="600" fill="#1f1f1f">장부별 요약 · 모든 값은 비용 차감 후</text><text x="712" y="436" text-anchor="end" font-size="11.5" fill="#6b6b6b">음영 행 = 판정·효과 계산에 쓰는 행</text><text x="48" y="462" font-size="11.5" fill="#6b6b6b">장부</text><text x="232" y="462" font-size="11.5" fill="#6b6b6b">비용 출처</text><text x="372" y="462" font-size="11.5" fill="#6b6b6b">수익률</text><text x="444" y="462" font-size="11.5" fill="#6b6b6b">MDD</text><text x="500" y="462" font-size="11.5" fill="#6b6b6b">샤프 비율</text><text x="568" y="462" font-size="11.5" fill="#6b6b6b">회전율</text><text x="632" y="462" font-size="11.5" fill="#6b6b6b">총 거래 비용</text><line x1="48" x2="712" y1="470" y2="470" stroke="#e4e2dc"></line><line x1="48" x2="60" y1="486" y2="486" stroke="#2f9e8f" stroke-width="2.5" stroke-dasharray="none"></line><text x="68" y="490" font-weight="600" fill="#1f1f1f">운영</text><text x="68" y="506" font-size="11.5" fill="#6b6b6b">교체 켬 · 실제 체결</text><text x="232" y="490" fill="#1f1f1f">KIS 추정치</text><text x="232" y="506" font-size="11.5" fill="#6b6b6b">prsm_tlex_smtl</text><text x="372" y="490" fill="#6b6b6b">—</text><text x="444" y="490" fill="#6b6b6b">—</text><text x="500" y="490" fill="#6b6b6b">—</text><text x="568" y="490" fill="#6b6b6b">—</text><text x="632" y="490" fill="#6b6b6b">— (추정)</text><line x1="48" x2="60" y1="522" y2="522" stroke="#2f9e8f" stroke-width="2.5" stroke-dasharray="3 2"></line><text x="68" y="526" font-weight="600" fill="#1f1f1f">운영 (보수적 재계산)</text><text x="68" y="542" font-size="11.5" fill="#6b6b6b">실제 체결을 보수적 규칙으로</text><text x="232" y="526" fill="#1f1f1f">설정 요율</text><text x="232" y="542" font-size="11.5" fill="#6b6b6b">검증하지 않음</text><text x="372" y="526" fill="#6b6b6b">—</text><text x="444" y="526" fill="#6b6b6b">—</text><text x="500" y="526" fill="#6b6b6b">—</text><text x="568" y="526" fill="#6b6b6b">—</text><text x="632" y="526" fill="#6b6b6b">—</text><line x1="48" x2="60" y1="558" y2="558" stroke="#8e5bd6" stroke-width="2.5" stroke-dasharray="none"></line><text x="68" y="562" fill="#1f1f1f">교체 없음</text><text x="68" y="578" font-size="11.5" fill="#6b6b6b">교체 끔</text><text x="232" y="562" fill="#1f1f1f">설정 요율</text><text x="232" y="578" font-size="11.5" fill="#6b6b6b">검증하지 않음</text><text x="372" y="562" fill="#6b6b6b">—</text><text x="444" y="562" fill="#6b6b6b">—</text><text x="500" y="562" fill="#6b6b6b">—</text><text x="568" y="562" fill="#6b6b6b">—</text><text x="632" y="562" fill="#6b6b6b">—</text><line x1="48" x2="60" y1="594" y2="594" stroke="#c9a227" stroke-width="2.5" stroke-dasharray="none"></line><text x="68" y="598" fill="#1f1f1f">jev 매수만</text><text x="68" y="614" font-size="11.5" fill="#6b6b6b">매도는 강제 청산만</text><text x="232" y="598" fill="#1f1f1f">설정 요율</text><text x="232" y="614" font-size="11.5" fill="#6b6b6b">검증하지 않음</text><text x="372" y="598" fill="#6b6b6b">—</text><text x="444" y="598" fill="#6b6b6b">—</text><text x="500" y="598" fill="#6b6b6b">—</text><text x="568" y="598" fill="#6b6b6b">—</text><text x="632" y="598" fill="#6b6b6b">—</text><line x1="48" x2="60" y1="630" y2="630" stroke="#d6457a" stroke-width="2.5" stroke-dasharray="none"></line><text x="68" y="634" fill="#1f1f1f">단순 규칙</text><text x="68" y="650" font-size="11.5" fill="#6b6b6b">SOX·야간선물 갭 + 모멘텀</text><text x="232" y="634" fill="#1f1f1f">설정 요율</text><text x="232" y="650" font-size="11.5" fill="#6b6b6b">검증하지 않음</text><text x="372" y="634" fill="#6b6b6b">—</text><text x="444" y="634" fill="#6b6b6b">—</text><text x="500" y="634" fill="#6b6b6b">—</text><text x="568" y="634" fill="#6b6b6b">—</text><text x="632" y="634" fill="#6b6b6b">—</text><line x1="48" x2="712" y1="664" y2="664" stroke="#e4e2dc"></line><text x="48" y="684" font-size="11.5" fill="#6b6b6b">비용 출처 · 운영: KIS 조회 추정치 prsm_tlex_smtl, 확정 값 API 없음 (B-02 9d)</text><text x="48" y="700" font-size="11.5" fill="#6b6b6b">가상 장부·재계산: 설정 요율 수수료 0.0142%·세금 0.20% (strategy.md 15장, 2차 자료, 검증하지 않음)</text></g><g><rect x="32" y="728" width="696" height="222" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="48" y="752" font-size="13" font-weight="600" fill="#1f1f1f">자산 곡선 · 구간 시작 대비 수익률(%, 비용 차감 후)</text><line x1="48" x2="64" y1="770" y2="770" stroke="#2f9e8f" stroke-width="2"></line><text x="70" y="774" font-size="11.5" fill="#1f1f1f">운영</text><line x1="112" x2="128" y1="770" y2="770" stroke="#2f9e8f" stroke-width="2" stroke-dasharray="5 4"></line><text x="134" y="774" font-size="11.5" fill="#1f1f1f">운영(보수적 재계산)</text><line x1="268" x2="284" y1="770" y2="770" stroke="#8e5bd6" stroke-width="1.5"></line><text x="290" y="774" font-size="11.5" fill="#1f1f1f">교체 없음</text><line x1="364" x2="380" y1="770" y2="770" stroke="#c9a227" stroke-width="1.5"></line><text x="386" y="774" font-size="11.5" fill="#1f1f1f">jev 매수만</text><line x1="464" x2="480" y1="770" y2="770" stroke="#d6457a" stroke-width="1.5"></line><text x="486" y="774" font-size="11.5" fill="#1f1f1f">단순 규칙</text><text x="48" y="796" font-size="11.5" fill="#6b6b6b">수익률(%)</text><text x="74" y="864" text-anchor="end" font-size="11.5" fill="#6b6b6b">0%</text><line x1="80" x2="704" y1="860" y2="860" stroke="#e4e2dc" stroke-dasharray="2 4"></line><line x1="80" x2="704" y1="900" y2="900" stroke="#b9b6ad"></line><polyline points="80,860 160,850 240,842 320,846 400,830 480,824 560,816 640,812 704,804" fill="none" stroke="#2f9e8f" stroke-width="2" stroke-dasharray="none"></polyline><polyline points="80,860 160,854 240,848 320,852 400,840 480,836 560,830 640,828 704,822" fill="none" stroke="#2f9e8f" stroke-width="2" stroke-dasharray="5 4"></polyline><polyline points="80,860 160,856 240,850 320,856 400,846 480,842 560,838 640,836 704,830" fill="none" stroke="#8e5bd6" stroke-width="1.5" stroke-dasharray="none"></polyline><polyline points="80,860 160,858 240,858 320,864 400,858 480,854 560,852 640,850 704,846" fill="none" stroke="#c9a227" stroke-width="1.5" stroke-dasharray="none"></polyline><polyline points="80,860 160,864 240,868 320,872 400,864 480,868 560,862 640,866 704,860" fill="none" stroke="#d6457a" stroke-width="1.5" stroke-dasharray="none"></polyline><text x="80" y="918" font-size="11.5" fill="#6b6b6b">구간 시작</text><text x="704" y="918" text-anchor="end" font-size="11.5" fill="#6b6b6b">오늘</text><text x="48" y="938" font-size="11.5" fill="#6b6b6b">선은 장식(값 없음). 고른 성과 구간 안만 그리고, 리셋을 넘어 곡선을 잇지 않는다</text></g><g><rect x="32" y="966" width="340" height="224" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="48" y="990" font-size="13" font-weight="600" fill="#1f1f1f">jev 보정 · 예측 확률 대비 실제</text><text x="48" y="1010" font-size="11.5" fill="#6b6b6b">판단 종류 (decisions.kind): BUY_SCREEN ▾</text><text x="48" y="1028" font-size="11.5" fill="#6b6b6b">실제 적중률</text><line x1="80" x2="80" y1="1034" y2="1126" stroke="#b9b6ad"></line><line x1="80" x2="340" y1="1126" y2="1126" stroke="#b9b6ad"></line><line x1="80" x2="330" y1="1126" y2="1034" stroke="#6b6b6b" stroke-dasharray="4 4"></line><circle cx="105" cy="1110" r="4" fill="#e8692c" stroke="#e8692c" stroke-width="1.5" stroke-dasharray="none"></circle><circle cx="155" cy="1092" r="4" fill="#e8692c" stroke="#e8692c" stroke-width="1.5" stroke-dasharray="none"></circle><circle cx="205" cy="1076" r="4" fill="#e8692c" stroke="#e8692c" stroke-width="1.5" stroke-dasharray="none"></circle><circle cx="255" cy="1068" r="4" fill="#e8692c" stroke="#e8692c" stroke-width="1.5" stroke-dasharray="none"></circle><circle cx="305" cy="1052" r="4" fill="none" stroke="#e8692c" stroke-width="1.5" stroke-dasharray="2 2"></circle><text x="105" y="1142" text-anchor="middle" font-size="10.5" fill="#6b6b6b">n —</text><text x="155" y="1142" text-anchor="middle" font-size="10.5" fill="#6b6b6b">n —</text><text x="205" y="1142" text-anchor="middle" font-size="10.5" fill="#6b6b6b">n —</text><text x="255" y="1142" text-anchor="middle" font-size="10.5" fill="#6b6b6b">n —</text><text x="305" y="1142" text-anchor="middle" font-size="10.5" fill="#6b6b6b">n —</text><text x="96" y="1046" font-size="11.5" fill="#6b6b6b">점선: 확률대로 맞은 경우</text><text x="340" y="1160" text-anchor="end" font-size="11.5" fill="#6b6b6b">예측 확률 구간 →</text><text x="48" y="1178" font-size="11.5" fill="#6b6b6b">n = 구간별 표본 수 · 빈 원 = 표본 부족(기준 미정)</text></g><g><rect x="388" y="966" width="340" height="224" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="404" y="990" font-size="13" font-weight="600" fill="#1f1f1f">매도 사후 평가 · jev가 판 종목</text><text x="404" y="1016" font-size="11.5" fill="#6b6b6b">종목</text><text x="456" y="1016" font-size="11.5" fill="#6b6b6b">매도 사유</text><text x="540" y="1016" font-size="11.5" fill="#6b6b6b">이후 N일 수익률</text><text x="640" y="1016" font-size="11.5" fill="#6b6b6b">판정</text><line x1="404" x2="712" y1="1024" y2="1024" stroke="#e4e2dc"></line><text x="404" y="1046" fill="#6b6b6b">—</text><text x="456" y="1046" fill="#1f1f1f">jev 재평가</text><text x="540" y="1046" fill="#6b6b6b">—</text><text x="640" y="1046" fill="#1f1f1f">피한 손실</text><text x="716" y="1046" text-anchor="end" fill="#2a73d9">▸</text><text x="404" y="1072" fill="#6b6b6b">—</text><text x="456" y="1072" fill="#1f1f1f">교체 매도</text><text x="540" y="1072" fill="#6b6b6b">—</text><text x="640" y="1072" fill="#1f1f1f">놓친 수익</text><text x="716" y="1072" text-anchor="end" fill="#2a73d9">▸</text><text x="404" y="1098" fill="#6b6b6b">—</text><text x="456" y="1098" fill="#1f1f1f">jev 재평가</text><text x="540" y="1098" fill="#6b6b6b">—</text><text x="640" y="1098" fill="#6b6b6b">—</text><text x="716" y="1098" text-anchor="end" fill="#2a73d9">▸</text><line x1="404" x2="712" y1="1110" y2="1110" stroke="#e4e2dc"></line><text x="404" y="1130" fill="#1f1f1f">피한 손실 합 —  ·  놓친 수익 합 —</text><text x="404" y="1148" font-size="11.5" fill="#6b6b6b">N은 아직 정하지 않았다 (미확인)</text><text x="404" y="1166" font-size="11.5" fill="#6b6b6b">행을 누르면 그날 판단 기록으로 간다</text></g></svg>
