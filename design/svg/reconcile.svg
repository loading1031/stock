<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 760 628" role="img" aria-label="기준을 넘는 불일치는 보정하지 않고 리셋으로 판정해 자동 주문을 끈다" font-size="12"><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1f1f">기준을 넘는 불일치는 보정하지 않고 리셋으로 판정해 자동 주문을 끈다</text><text x="24" y="50" font-size="11.5" fill="#6b6b6b">와이어프레임 · 모의 주식 계좌 · 리셋 판정된 실행을 고른 모습, 값은 자리 표시</text><g><rect x="16" y="64" width="728" height="540" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect></g><g><rect x="16" y="64" width="728" height="40" rx="8" fill="#ededeb" stroke="#e4e2dc"></rect><text x="380" y="89" text-anchor="middle" fill="#6b6b6b">자동 주문 표시줄 · 변형 3 (꺼짐 · 리셋 판정)</text></g><g><text x="32" y="136" font-size="15" font-weight="600" fill="#1f1f1f">대사 결과</text><text x="32" y="154" font-size="11.5" fill="#6b6b6b">관리 › 대사 결과</text><text x="728" y="136" text-anchor="end" font-size="11.5" fill="#2a73d9">주문 ▸</text><text x="728" y="154" text-anchor="end" font-size="11.5" fill="#6b6b6b">업무 흐름 4 · 대사 불일치</text></g><g><text x="32" y="184" font-size="13" font-weight="600" fill="#1f1f1f">마지막 대사: — · 결과 리셋 판정 · 보정 0건</text><text x="728" y="184" text-anchor="end" font-size="11.5" fill="#6b6b6b">결과: 일치 · 보정함 · 리셋 판정</text></g><g><rect x="32" y="200" width="696" height="84" rx="8" fill="#d23a3a" fill-opacity="0.08" stroke="#d23a3a" stroke-width="2"></rect><text x="48" y="222" font-size="13" font-weight="600" fill="#1f1f1f">계좌 리셋 판정 · 불일치가 기준을 넘음</text><text x="48" y="240" font-size="11.5" fill="#1f1f1f">기준 예시: 총자산의 5% 또는 보유 종목 수 불일치 (기준값 가정)</text><text x="48" y="257" font-size="11.5" fill="#6b6b6b">자동 주문 꺼짐 · 강제 청산도 멈춤 · 단순 보정하지 않음 (plan.md 3.8)</text><text x="48" y="274" font-size="11.5" fill="#6b6b6b">누르면 확인 대화상자: 닫히는 포지션 계획 —건 · 새 성과 구간(account_epochs)</text><rect x="576" y="216" width="136" height="30" rx="6" fill="#f2a516" fill-opacity="0.12" stroke="#f2a516" stroke-width="2"></rect><text x="644" y="236" text-anchor="middle" font-weight="600" fill="#1f1f1f">확인하고 다시 켜기</text></g><g><rect x="32" y="300" width="248" height="288" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="48" y="324" font-size="13" font-weight="600" fill="#1f1f1f">대사 실행</text><text x="48" y="352" font-size="11.5" fill="#6b6b6b">시점</text><text x="124" y="352" font-size="11.5" fill="#6b6b6b">날짜·시각</text><text x="196" y="352" font-size="11.5" fill="#6b6b6b">결과</text><line x1="48" x2="264" y1="360" y2="360" stroke="#e4e2dc"></line><rect x="40" y="368" width="232" height="28" rx="6" fill="#2a73d9" fill-opacity="0.12" stroke="#2a73d9" stroke-width="2"></rect><text x="48" y="386" font-weight="600" fill="#1f1f1f">장 마감 후</text><text x="124" y="386" fill="#6b6b6b">—</text><circle cx="200" cy="382" r="4" fill="#d23a3a"></circle><text x="208" y="386" font-size="11.5" fill="#1f1f1f">리셋 판정</text><text x="48" y="418" fill="#1f1f1f">장 시작 전</text><text x="124" y="418" fill="#6b6b6b">—</text><circle cx="200" cy="414" r="4" fill="#f2a516"></circle><text x="208" y="418" font-size="11.5" fill="#1f1f1f">보정함</text><text x="48" y="450" fill="#1f1f1f">장 마감 후</text><text x="124" y="450" fill="#6b6b6b">—</text><circle cx="200" cy="446" r="4" fill="#1a9e2a"></circle><text x="208" y="450" font-size="11.5" fill="#1f1f1f">일치</text><text x="48" y="482" fill="#1f1f1f">장 시작 전</text><text x="124" y="482" fill="#6b6b6b">—</text><circle cx="200" cy="478" r="4" fill="#1a9e2a"></circle><text x="208" y="482" font-size="11.5" fill="#1f1f1f">일치</text><line x1="48" x2="264" y1="540" y2="540" stroke="#e4e2dc"></line><text x="48" y="560" font-size="11.5" fill="#6b6b6b">하루 두 번: 장 시작 전 · 장 마감 후</text><text x="48" y="576" font-size="11.5" fill="#6b6b6b">최근 순 정렬 (가정)</text></g><g><rect x="296" y="300" width="432" height="288" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="312" y="324" font-size="13" font-weight="600" fill="#1f1f1f">장 마감 후 · — · 리셋 판정</text><text x="712" y="324" text-anchor="end" font-size="11.5" fill="#6b6b6b">정답은 KIS 쪽</text><text x="312" y="342" font-size="11.5" fill="#6b6b6b">KIS 조회 시각 — · 우리 값 기준 시각 —</text><text x="312" y="366" font-size="11.5" fill="#6b6b6b">항목</text><text x="392" y="366" font-size="11.5" fill="#6b6b6b">KIS 값</text><text x="448" y="366" font-size="11.5" fill="#6b6b6b">우리 값</text><text x="512" y="366" font-size="11.5" fill="#6b6b6b">차이</text><text x="568" y="366" font-size="11.5" fill="#6b6b6b">처리</text><line x1="312" x2="712" y1="374" y2="374" stroke="#e4e2dc"></line><text x="312" y="398" fill="#1f1f1f">현금</text><text x="392" y="398" fill="#6b6b6b">—</text><text x="448" y="398" fill="#6b6b6b">—</text><text x="512" y="398" fill="#d23a3a">—</text><text x="568" y="398" fill="#1f1f1f">보정 안 함 · 리셋</text><text x="312" y="426" fill="#1f1f1f">보유 수량</text><text x="392" y="426" fill="#6b6b6b">—</text><text x="448" y="426" fill="#6b6b6b">—</text><text x="512" y="426" fill="#d23a3a">—</text><text x="568" y="426" fill="#1f1f1f">보정 안 함 · 리셋</text><text x="312" y="454" fill="#1f1f1f">주문 누계</text><text x="392" y="454" fill="#6b6b6b">—</text><text x="448" y="454" fill="#6b6b6b">—</text><text x="512" y="454" fill="#d23a3a">—</text><text x="568" y="454" fill="#1f1f1f">보정 안 함 · 리셋</text><text x="312" y="474" font-size="11.5" fill="#2a73d9">종목 A · 주문번호 — · 주문 화면의 해당 체인 ▸</text><line x1="312" x2="712" y1="490" y2="490" stroke="#e4e2dc"></line><text x="312" y="512" font-size="13" font-weight="600" fill="#1f1f1f">보정 내역 · 리셋 판정이라 없음</text><text x="312" y="532" font-size="11.5" fill="#6b6b6b">기준 이하 실행에만: ADJUST(현금 행),</text><text x="312" y="550" font-size="11.5" fill="#6b6b6b">UNKNOWN 확정 · 통보 누락 · 장 마감 소멸 (가정)</text><text x="312" y="568" font-size="11.5" fill="#6b6b6b">보유 수량 차이를 고치는 방법은 미정 (plan.md 4.6)</text></g></svg>
