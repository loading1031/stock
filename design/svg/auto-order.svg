<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 760 876" role="img" aria-label="끄기는 막히는 것을, 다시 켜기는 곧 나갈 강제 청산을 확인받는다" font-size="12"><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1f1f">끄기는 막히는 것을, 다시 켜기는 곧 나갈 강제 청산을 확인받는다</text><text x="24" y="50" font-size="11.5" fill="#6b6b6b">와이어프레임 · 모의 주식 계좌 · 대화상자 내용만, 값은 자리 표시</text><g><rect x="16" y="64" width="728" height="788" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect></g><g><rect x="16" y="64" width="728" height="40" rx="8" fill="#ededeb" stroke="#e4e2dc"></rect><text x="380" y="89" text-anchor="middle" fill="#6b6b6b">자동 주문 표시줄 · 변형 1 (켜짐) · 토글을 누르면 ①</text></g><g><text x="32" y="136" font-size="15" font-weight="600" fill="#1f1f1f">자동 주문 켜기·끄기</text><text x="32" y="154" font-size="11.5" fill="#6b6b6b">모든 화면 · 표시줄의 토글이 아래 대화상자를 연다</text><text x="728" y="136" text-anchor="end" font-size="11.5" fill="#2a73d9">미체결 주문 취소 ▸</text><text x="728" y="154" text-anchor="end" font-size="11.5" fill="#6b6b6b">업무 흐름 3 · 멈추고 정리</text></g><text x="32" y="186" font-size="13" font-weight="600" fill="#1f1f1f">① 끄기 확인 · 변형 1에서 토글을 누르면</text><g><rect x="96" y="196" width="568" height="220" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="112" y="224" font-size="13" font-weight="600" fill="#1f1f1f">자동 주문을 끌까요?</text><text x="648" y="224" text-anchor="end" font-size="11.5" fill="#6b6b6b">확인 대화상자 · 경고</text><rect x="112" y="236" width="536" height="30" rx="6" fill="#f2a516" fill-opacity="0.12" stroke="#f2a516"></rect><text x="124" y="256" font-size="13" font-weight="600" fill="#1f1f1f">강제 청산도 멈춤 — 손절 보호 없음</text><text x="112" y="292" font-size="11.5" font-weight="600" fill="#6b6b6b">막히는 것</text><text x="112" y="314" font-size="13" fill="#1f1f1f">새 자동 주문 (전략 매수·매도)</text><text x="112" y="334" font-size="13" fill="#1f1f1f">강제 청산 주문</text><text x="384" y="292" font-size="11.5" font-weight="600" fill="#6b6b6b">그대로인 것</text><text x="384" y="314" font-size="13" fill="#1f1f1f">낸 미체결 주문 — 건 (취소 안 함)</text><text x="384" y="334" font-size="13" fill="#1f1f1f">보유 종목 — 종목</text><text x="384" y="354" font-size="13" fill="#1f1f1f">수동 주문 (한 번 더 확인)</text><g><rect x="464" y="372" width="88" height="28" rx="6" fill="none" stroke="#2a73d9" stroke-width="2"></rect><rect x="560" y="372" width="88" height="28" rx="6" fill="#f2a516" fill-opacity="0.12" stroke="#f2a516" stroke-width="2"></rect></g><text x="508" y="391" text-anchor="middle" fill="#1f1f1f">취소</text><text x="604" y="391" text-anchor="middle" font-weight="600" fill="#1f1f1f">끄기</text></g><text x="96" y="440" font-size="11.5" fill="#6b6b6b">끈 뒤 표시줄은 변형 2 (꺼짐 · 사람이 끔)</text><text x="96" y="458" font-size="11.5" fill="#2a73d9">미체결 — 건 · 미체결 주문 취소로 ▸ (바로 취소하지 않고 그 화면으로만)</text><text x="32" y="498" font-size="13" font-weight="600" fill="#1f1f1f">② 다시 켜기 확인 · 변형 2에서 토글을 누르면</text><g><rect x="96" y="508" width="568" height="260" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="112" y="536" font-size="13" font-weight="600" fill="#1f1f1f">자동 주문을 다시 켤까요?</text><text x="648" y="536" text-anchor="end" font-size="11.5" fill="#6b6b6b">확인 대화상자 · 경고</text><text x="112" y="560" font-size="13" fill="#1f1f1f">켜지는 즉시 아래 강제 청산 주문이 나간다.</text><text x="112" y="580" font-size="11.5" fill="#6b6b6b">꺼진 사이 청산 조건에 닿은 종목 · 목록 기준 시각 —</text><text x="112" y="608" font-size="11.5" fill="#6b6b6b">종목</text><text x="300" y="608" font-size="11.5" fill="#6b6b6b">방향</text><text x="380" y="608" font-size="11.5" fill="#6b6b6b">수량</text><text x="460" y="608" font-size="11.5" fill="#6b6b6b">주문 방식</text><line x1="112" x2="648" y1="616" y2="616" stroke="#e4e2dc"></line><text x="112" y="638" font-size="13" fill="#1f1f1f">종목 A</text><text x="300" y="638" font-size="13" font-weight="600" fill="#2a73d9">매도</text><text x="380" y="638" font-size="13" fill="#1f1f1f">— 주</text><text x="460" y="638" font-size="13" fill="#6b6b6b">—</text><text x="112" y="662" font-size="13" fill="#1f1f1f">종목 B</text><text x="300" y="662" font-size="13" font-weight="600" fill="#2a73d9">매도</text><text x="380" y="662" font-size="13" fill="#1f1f1f">— 주</text><text x="460" y="662" font-size="13" fill="#6b6b6b">—</text><text x="112" y="690" font-size="11.5" fill="#6b6b6b">목록이 비면 「나갈 강제 청산 없음」을 보인다 (가정)</text><text x="112" y="708" font-size="11.5" fill="#6b6b6b">켜는 순간 다시 계산해 목록과 다르면 다시 확인받는다 (제안)</text><g><rect x="464" y="724" width="88" height="28" rx="6" fill="none" stroke="#2a73d9" stroke-width="2"></rect><rect x="560" y="724" width="88" height="28" rx="6" fill="#f2a516" fill-opacity="0.12" stroke="#f2a516" stroke-width="2"></rect></g><text x="508" y="743" text-anchor="middle" fill="#1f1f1f">취소</text><text x="604" y="743" text-anchor="middle" font-weight="600" fill="#1f1f1f">켜기</text></g><text x="96" y="792" font-size="11.5" fill="#6b6b6b">켠 뒤 표시줄은 변형 1 (켜짐). 리셋 판정(변형 3)으로 꺼졌다면 대사 결과에서 다시 켠다</text><text x="32" y="820" font-size="11.5" fill="#6b6b6b">표시줄 변형은 「자동 주문 표시줄」이 정한다. 신규 매수 건너뜀(변형 4)은 끄기와 별개다</text><text x="32" y="838" font-size="11.5" fill="#6b6b6b">데이터: risk_limits.auto_order_enabled</text></svg>
