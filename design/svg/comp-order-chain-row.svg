<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 760 448" role="img" aria-label="정정 체인은 한 주문으로 묶고 번호는 펼쳐서 본다" font-size="13"><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1f1f">정정 체인은 한 주문으로 묶고, 번호는 펼쳐서 본다</text><text x="24" y="50" font-size="11.5" fill="#6b6b6b">예시: B-02 실측 SH에너지화학(002360) 지정가 매수 500주, 2026-10-15</text><g><rect x="24" y="68" width="712" height="48" rx="8" fill="#2a73d9" fill-opacity="0.12" stroke="#2a73d9" stroke-width="2"></rect><text x="40" y="97" font-weight="600" fill="#1f1f1f">▾ SH에너지화학 · 매수 · 지정가 · 번호 5개</text><text x="604" y="97" text-anchor="end" fill="#1f1f1f">주문 500 · 체결 17 · 취소 483 · 잔량 0</text><rect x="620" y="80" width="100" height="24" rx="12" fill="none" stroke="#b9b6ad"></rect><text x="670" y="96" text-anchor="middle" font-size="11.5" fill="#1f1f1f">끝남</text></g><g fill="none" stroke="#b9b6ad" stroke-width="1.25"><path d="M72 172V200H80"></path><path d="M104 220V296H112"></path><path d="M104 248H112"></path><path d="M136 316V344H144"></path></g><g><rect x="48" y="132" width="688" height="40" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="64" y="156" font-weight="600" fill="#1f1f1f">25085</text><text x="128" y="156" fill="#1f1f1f">원주문 · 3,680원 · 500주</text><text x="720" y="156" text-anchor="end" font-size="11.5" fill="#6b6b6b">체결 6 · 494주를 25105로 옮김</text></g><g><rect x="80" y="180" width="656" height="40" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="96" y="204" font-weight="600" fill="#1f1f1f">25105</text><text x="160" y="204" fill="#1f1f1f">가격 정정 · 3,685원 · 494주</text><text x="720" y="204" text-anchor="end" font-size="11.5" fill="#6b6b6b">체결 9 · 200주를 25204로 옮김</text></g><g><rect x="112" y="228" width="624" height="40" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="128" y="252" font-weight="600" fill="#1f1f1f">25234</text><text x="192" y="252" fill="#1f1f1f">취소 · 285주</text><text x="720" y="252" text-anchor="end" font-size="11.5" fill="#6b6b6b">25105의 남은 수량 전부</text></g><g><rect x="112" y="276" width="624" height="40" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="128" y="300" font-weight="600" fill="#1f1f1f">25204</text><text x="192" y="300" fill="#1f1f1f">수량 정정 · 3,690원 · 200주</text><text x="720" y="300" text-anchor="end" font-size="11.5" fill="#6b6b6b">체결 2</text></g><g><rect x="144" y="324" width="592" height="40" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="160" y="348" font-weight="600" fill="#1f1f1f">25251</text><text x="224" y="348" fill="#1f1f1f">취소 · 198주</text><text x="720" y="348" text-anchor="end" font-size="11.5" fill="#6b6b6b">25204의 남은 수량 전부</text></g><g><rect x="24" y="380" width="712" height="32" rx="8" fill="#1a9e2a" fill-opacity="0.12" stroke="#1a9e2a" stroke-width="1.25"></rect><text x="40" y="400" fill="#1f1f1f">합계 검사: 처음 500주 = 체결 17 + 취소 483 + 잔량 0</text></g><text x="24" y="436" font-size="11.5" fill="#6b6b6b">체결은 통보가 온 번호에 쌓는다. 원주문번호(OODER_NO)는 직전 주문을 가리킨다</text></svg>
