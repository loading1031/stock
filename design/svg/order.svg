#6b6b6b">잔량</text><text x="416" y="578" font-size="11.5" fill="#6b6b6b">평균 체결가</text><text x="488" y="578" font-size="11.5" fill="#6b6b6b">상태</text><text x="592" y="578" font-size="11.5" fill="#6b6b6b">번호</text><line x1="48" x2="712" y1="586" y2="586" stroke="#e4e2dc"></line><text x="48" y="610" fill="#1f1f1f">▸ SH에너지화학</text><text x="144" y="610" fill="#1f1f1f">수동</text><text x="180" y="610" font-weight="600" fill="#d23a3a">매수</text><text x="216" y="610" fill="#1f1f1f">지정가</text><text x="264" y="610" fill="#1f1f1f">500</text><text x="302" y="610" fill="#1f1f1f">17</text><text x="340" y="610" fill="#1f1f1f">483</text><text x="378" y="610" fill="#1f1f1f">0</text><text x="416" y="610" fill="#6b6b6b">—</text><text x="488" y="610" fill="#1f1f1f">부분 체결 후 취소</text><text x="592" y="610" fill="#1f1f1f">5개</text><text x="712" y="610" text-anchor="end" fill="#2a73d9">펼치기</text><text x="48" y="638" fill="#1f1f1f">▸ 삼성전자</text><text x="144" y="638" fill="#1f1f1f">수동</text><text x="180" y="638" font-weight="600" fill="#d23a3a">매수</text><text x="216" y="638" fill="#1f1f1f">지정가</text><text x="264" y="638" fill="#1f1f1f">1</text><text x="302" y="638" fill="#1f1f1f">1</text><text x="340" y="638" fill="#1f1f1f">0</text><text x="378" y="638" fill="#1f1f1f">0</text><text x="416" y="638" fill="#1f1f1f">212,000</text><text x="488" y="638" fill="#1f1f1f">체결 완료</text><text x="592" y="638" fill="#1f1f1f">2개</text><text x="712" y="638" text-anchor="end" fill="#2a73d9">펼치기</text><text x="48" y="666" fill="#1f1f1f">▾ SH에너지화학</text><text x="144" y="666" fill="#1f1f1f">수동</text><text x="180" y="666" font-weight="600" fill="#2a73d9">매도</text><text x="216" y="666" fill="#1f1f1f">시장가</text><text x="264" y="666" fill="#1f1f1f">600</text><text x="302" y="666" fill="#1f1f1f">24</text><text x="340" y="666" fill="#1f1f1f">0</text><text x="378" y="666" fill="#1f1f1f">576</text><text x="416" y="666" fill="#6b6b6b">—</text><text x="488" y="666" fill="#1f1f1f">부분 체결</text><text x="592" y="666" fill="#1f1f1f">2개</text><text x="712" y="666" text-anchor="end" fill="#2a73d9">접기</text><g><rect x="64" y="680" width="648" height="24" rx="6" fill="none" stroke="#e4e2dc"></rect><text x="80" y="696" fill="#1f1f1f">20620 · 원주문 · 잔량 276주</text><rect x="600" y="682" width="48" height="20" rx="6" fill="none" stroke="#2a73d9"></rect><text x="624" y="696" text-anchor="middle" font-size="11.5" fill="#2a73d9">정정</text><rect x="656" y="682" width="48" height="20" rx="6" fill="none" stroke="#2a73d9"></rect><text x="680" y="696" text-anchor="middle" font-size="11.5" fill="#2a73d9">취소</text></g><g><rect x="64" y="708" width="648" height="24" rx="6" fill="none" stroke="#e4e2dc"></rect><text x="80" y="724" fill="#1f1f1f">22608 · 정정 · 잔량 300주</text><rect x="600" y="710" width="48" height="20" rx="6" fill="none" stroke="#2a73d9"></rect><text x="624" y="724" text-anchor="middle" font-size="11.5" fill="#2a73d9">정정</text><rect x="656" y="710" width="48" height="20" rx="6" fill="none" stroke="#2a73d9"></rect><text x="680" y="724" text-anchor="middle" font-size="11.5" fill="#2a73d9">취소</text></g><g><text x="48" y="753" fill="#6b6b6b">▸ 가상 예시</text><text x="144" y="753" fill="#1f1f1f">수동</text><text x="180" y="753" font-weight="600" fill="#d23a3a">매수</text><text x="216" y="753" fill="#1f1f1f">지정가</text><text x="264" y="753" fill="#6b6b6b">—</text><text x="302" y="753" fill="#6b6b6b">—</text><text x="340" y="753" fill="#6b6b6b">—</text><text x="378" y="753" fill="#6b6b6b">—</text><text x="416" y="753" fill="#6b6b6b">—</text><rect x="484" y="739" width="60" height="20" rx="10" fill="#f2a516" fill-opacity="0.12" stroke="#f2a516"></rect><text x="514" y="753" text-anchor="middle" font-size="11.5" fill="#1f1f1f">확인 중</text><text x="592" y="753" fill="#6b6b6b">없음</text><text x="712" y="753" text-anchor="end" font-size="11.5" fill="#1f1f1f">재주문 막음</text></g><text x="48" y="784" font-size="11.5" fill="#6b6b6b">수량은 체인 합계: 주문 = 체결 + 취소 + 잔량. 안 맞으면 경고색. 평균 체결가 — = 실측 값 없음</text><text x="48" y="802" font-size="11.5" fill="#6b6b6b">정정·취소 버튼은 펼친 번호 행에만 있다. 누르면 확인 대화상자에 대상 번호가 나온다</text><text x="48" y="820" font-size="11.5" fill="#6b6b6b">지정가 정정은 가격이 같으면 보내기 전에 막는다(KIS 40410000). 확인 중 행은 정정·취소·재주문을 막는다</text></g><g><rect x="32" y="846" width="340" height="44" rx="8" fill="#ededeb" stroke="#b9b6ad"></rect><text x="48" y="864" font-weight="600" fill="#1f1f1f">접수 · SH에너지화학 시장가 매도 · 20620</text><text x="48" y="881" font-size="11.5" fill="#6b6b6b">시장가는 접수 가격이 0으로 온다</text></g><g><rect x="388" y="846" width="340" height="44" rx="8" fill="#ededeb" stroke="#b9b6ad"></rect><text x="404" y="864" font-weight="600" fill="#1f1f1f">체결 · SH에너지화학 매수 · 25204</text><text x="404" y="881" font-size="11.5" fill="#6b6b6b">건별 1주 3,680원 · 주문가 3,690원 · 누계 17/500</text></g><g><rect x="16" y="920" width="728" height="116" rx="8" fill="none" stroke="#b9b6ad" stroke-dasharray="4 4"></rect><text x="32" y="944" font-size="13" font-weight="600" fill="#1f1f1f">자동 주문이 꺼진 동안의 주문 화면 (M4부터)</text><rect x="32" y="956" width="696" height="28" rx="6" fill="#ededeb" stroke="#e4e2dc"></rect><text x="380" y="975" text-anchor="middle" font-size="11.5" fill="#6b6b6b">자동 주문 표시줄 · 변형 2 (꺼짐 · 사람이 끔)</text><text x="32" y="1006" font-size="11.5" fill="#1f1f1f">확인 대화상자에 ‘자동 주문 꺼짐’ 경고 줄이 붙어, 수동 주문을 한 번 더 확인받는다</text><text x="32" y="1024" font-size="11.5" fill="#6b6b6b">그동안 강제 청산(손절)도 나가지 않는다는 경고는 표시줄 변형 2가 보인다</text></g></svg>
