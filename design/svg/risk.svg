<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 760 808" role="img" aria-label="계좌 한도를 고쳐 저장하면 확인을 거쳐 다음 주문부터 적용한다" font-size="12"><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1f1f">계좌 한도를 고쳐 저장하면 확인을 거쳐 다음 주문부터 적용한다</text><text x="24" y="50" font-size="11.5" fill="#6b6b6b">와이어프레임 · 모의 주식 계좌 · 값은 plan.md 예시 또는 자리 표시</text><g><rect x="16" y="64" width="728" height="720" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect></g><g><rect x="16" y="64" width="728" height="40" rx="8" fill="#ededeb" stroke="#e4e2dc"></rect><text x="380" y="89" text-anchor="middle" fill="#6b6b6b">자동 주문 표시줄 · 변형 1 (켜짐)</text></g><g><text x="32" y="136" font-size="15" font-weight="600" fill="#1f1f1f">리스크 설정</text><text x="32" y="154" font-size="11.5" fill="#6b6b6b">관리 › 리스크 설정</text><text x="728" y="136" text-anchor="end" font-size="11.5" fill="#2a73d9">전략 목록·설정 ▸</text><text x="728" y="154" text-anchor="end" font-size="11.5" fill="#6b6b6b">전략별 값은 전략 화면에서</text></g><g><text x="32" y="186" font-size="13" font-weight="600" fill="#1f1f1f">계좌</text><text x="72" y="186" font-size="13" fill="#1f1f1f">모의 · 주식 (읽기 전용)</text><text x="728" y="186" text-anchor="end" font-size="11.5" fill="#6b6b6b">계좌를 고르는 메뉴는 없다 · 계좌 단위 한도만 둔다</text></g><g><rect x="32" y="200" width="696" height="444" rx="8" fill="none" stroke="#b9b6ad" stroke-width="1.25"></rect><text x="48" y="224" font-size="13" font-weight="600" fill="#1f1f1f">계좌 단위 한도</text><text x="712" y="224" text-anchor="end" font-size="11.5" fill="#6b6b6b">예시값 = plan.md 예시, 확정 아님</text><line x1="48" x2="712" y1="236" y2="236" stroke="#e4e2dc"></line><text x="48" y="256" font-size="11.5" fill="#6b6b6b">한도</text><text x="392" y="256" font-size="11.5" fill="#6b6b6b">값</text><text x="568" y="256" font-size="11.5" fill="#6b6b6b">수동 주문에서</text><line x1="48" x2="712" y1="264" y2="264" stroke="#e4e2dc"></line></g><g><text x="48" y="284" font-size="13" font-weight="600" fill="#1f1f1f">종목당 최대 비중</text><text x="48" y="302" font-size="11.5" fill="#6b6b6b">평가금액 대비</text><rect x="392" y="274" width="152" height="28" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="404" y="292" fill="#1f1f1f">20</text><text x="532" y="292" text-anchor="end" fill="#6b6b6b">%</text><text x="568" y="292" font-size="11.5" fill="#6b6b6b">막음·경고 미정</text><line x1="48" x2="712" y1="320" y2="320" stroke="#e4e2dc"></line></g><g><text x="48" y="340" font-size="13" font-weight="600" fill="#1f1f1f">주문당 최대 금액</text><text x="48" y="358" font-size="11.5" fill="#6b6b6b">주문 한 건의 금액</text><rect x="392" y="330" width="152" height="28" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="404" y="348" fill="#1f1f1f">1,000,000</text><text x="532" y="348" text-anchor="end" fill="#6b6b6b">원</text><text x="568" y="348" font-size="11.5" fill="#6b6b6b">막음·경고 미정</text><line x1="48" x2="712" y1="376" y2="376" stroke="#e4e2dc"></line></g><g><text x="48" y="396" font-size="13" font-weight="600" fill="#1f1f1f">일일 손실 한도</text><text x="48" y="414" font-size="11.5" fill="#6b6b6b">넘으면 그날 신규 매수 건너뜀</text><rect x="392" y="386" width="152" height="28" rx="6" fill="none" stroke="#b9b6ad"></rect><text x="404" y="404" fill="#6b6b6b">— 입력 필요</text><text x="532" y="404" text-anchor="end" fill="#6b6b6b">원</text><text x="568" y="404" font-size="11.5" fill="#6b6b6b">막음·경고 미정</text><text x="392" y="432" font-size="11.5" fill="#6b6b6b">비우면 저장하지 않는다 (가정)</text><rect x="48" y="444" width="664" height="48" rx="6" fill="#ededeb" stroke="#e4e2dc"></rect><text x="60" y="464" font-size="11.5" fill="#1f1f1f">오늘 손실 — / 한도 —  ·  넘으면 표시줄 변형 4 (오늘 신규 매수 건너뜀)</text><text x="60" y="482" font-size="11.5" fill="#6b6b6b">건너뛰는 동안 자동 주문 토글은 켜짐이고 강제 청산은 계속 돈다</text><line x1="48" x2="712" y1="508" y2="508" stroke="#e4e2dc"></line></g><g><text x="48" y="528" font-size="13" font-weight="600" fill="#1f1f1f">거래 가능 시간</text><text x="48" y="546" font-size="11.5" fill="#6b6b6b">기본은 정규장만</text><text x="48" y="562" font-size="11.5" fill="#6b6b6b">프리·애프터는 모의 계좌에서 켤 수 없다</text><text x="392" y="532" font-size="13" fill="#1f1f1f">정규장만 (계좌 기본)</text><text x="392" y="552" font-size="11.5" fill="#2a73d9">프리·애프터는 전략 목록·설정에서 켠다 ▸</text><line x1="48" x2="712" y1="576" y2="576" stroke="#e4e2dc"></line></g><g><text x="48" y="596" font-size="13" font-weight="600" fill="#1f1f1f">미수 금지</text><text x="48" y="614" font-size="11.5" fill="#6b6b6b">매수는 원화 현금 잔고 − 묶음 안에서만</text><text x="48" y="630" font-size="11.5" fill="#6b6b6b">모의 계좌의 미수 허용 여부는 미확인</text><text x="392" y="600" font-size="13" fill="#1f1f1f">켜짐 · 고정</text><text x="392" y="618" font-size="11.5" fill="#6b6b6b">모의에서는 편집 불가 (제안)</text></g><g><rect x="32" y="660" width="696" height="48" rx="8" fill="#ededeb" stroke="#e4e2dc"></rect><text x="48" y="688" font-size="13" font-weight="600" fill="#1f1f1f">호출 빈도</text><text x="136" y="688" fill="#1f1f1f">초당 2건</text><text x="216" y="688" font-size="11.5" fill="#6b6b6b">B-02 실측: 3건부터 거부, 2건도 가끔 초과</text><text x="712" y="688" text-anchor="end" font-size="11.5" fill="#6b6b6b">편집 불가</text></g><g><text x="32" y="740" font-size="11.5" fill="#1f1f1f">저장 → 확인 대화상자(지금 → 새 값). 느슨해지는 항목은 경고색</text><text x="32" y="758" font-size="11.5" fill="#6b6b6b">적용: 다음 주문부터 (가정) · 이미 낸 주문에는 소급하지 않는다</text><rect x="608" y="724" width="120" height="32" rx="6" fill="#2a73d9" fill-opacity="0.12" stroke="#2a73d9" stroke-width="2"></rect><text x="668" y="744" text-anchor="middle" font-weight="600" fill="#1f1f1f">저장</text><text x="728" y="774" text-anchor="end" font-size="11.5" fill="#6b6b6b">마지막 변경: —</text></g></svg>
